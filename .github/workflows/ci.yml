# Spec: foo-plan §2 (CI), §4 (test strategy), §5 M0. windows-latest is the source of truth; ubuntu-latest is the fast lane.
name: CI

on:
  push:
    branches: [main]
  # Windows minutes count double against the Actions quota (Vikas, 2026-10-19, docs/build-method.md §1a): a ticket PR into a
  # milestone branch runs the fast lane, plus the golden lane when it is ready and touches the screen; the full Windows
  # suite runs on PRs into main (milestone close-out), on main, and by hand (workflow_dispatch). A draft PR runs only the
  # fast lane.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# The PR action is in the group: marking a PR ready right after a push must not let the push's run (draft payload, no
# golden lane) cancel the ready run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast lane (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fid-guard reads the PR's commits and diff
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install scoped BDD tooling when present
        if: hashFiles('test/bdd/package.json') != ''
        run: pnpm --dir test/bdd install --frozen-lockfile
      - run: pnpm spec:verify
      - name: FID-02 / FID-06 / FID-19 guard (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm fid:guard
      - name: FID-18 trace matrix
        run: pnpm trace:check
      - run: pnpm check:copy
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Does this PR change what the screen draws? Then a ticket PR also runs the golden lane (its picture checks).
  screen:
    name: Screen change check
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(src/renderer/|src/shared/copy/|design/|golden/|test/fidelity/|index\.html)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    # Split into 4 parallel shards (Vikas, option A, 2026-10-19 06:53Z): same tests, a quarter of the wall time each.
    # Shard 1 also typechecks, packages and uploads the app for manual testing.
    name: Full suite (windows-latest, shard ${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.base.ref == 'main')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # better-sqlite3 always compiles on install. pnpm's bundled node-gyp 11 cannot find Visual Studio 2026 (v18)
      # on the runner, so install without scripts and compile with the pinned node-gyp 12.4, which knows VS 2026.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install scoped BDD tooling when present
        if: hashFiles('test/bdd/package.json') != ''
        run: pnpm --dir test/bdd install --frozen-lockfile
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      - name: Build better-sqlite3 for Node (unit tests)
        run: pnpm rebuild:node
      - run: pnpm typecheck
        if: matrix.shard == 1
      - name: Unit, article and fidelity tests
        run: pnpm test --shard=${{ matrix.shard }}/4
      - run: pnpm build
      - name: Rebuild native modules for Electron
        run: pnpm rebuild:electron
      - name: E2E (Playwright for Electron)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      # Agents cannot download CI artifacts, so a failed e2e test's page state goes in the log, where they can read it.
      - name: Page state at each failed e2e test
        if: failure()
        shell: bash
        run: bash scripts/print-error-context.sh
      - name: Package (unpacked)
        if: matrix.shard == 1
        run: pnpm package:dir
      - name: No test hooks in the production build (08-3 §22.1)
        if: matrix.shard == 1
        shell: bash
        run: |
          for needle in "__fooTest" "test:clock" "test:seed"; do
            if grep -a -q "$needle" dist/win-unpacked/resources/app.asar; then echo "$needle found in app.asar"; exit 1; fi
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-evidence-windows-${{ matrix.shard }}
          path: |
            qa-evidence/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      # A ready-to-run copy for manual testing on Vikas's PC: unzip, open foo.exe (unsigned for testers).
      - name: Upload the app for manual testing
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: foo-windows-app
          path: dist/win-unpacked/
          retention-days: 14

  # 11-fidelity §11.2 golden lane: renders the current milestone's references in Electron's Chromium, runs Tier R/Tier B
  # for built steps, writes the fidelity report and pushes the evidence to the `evidence` branch (agents cannot read CI
  # artifacts). FIDELITY_MILESTONE names the milestone this branch builds (the report and the evidence folder); bump it when
  # the next milestone starts. FIDELITY_REFS lists every milestone whose app captures still run, so Tier R finds a reference
  # for each capture (M1's Blueprint captures keep running until they are blessed into Tier B).
  golden:
    name: Golden lane (windows-latest)
    needs: screen
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.pull_request.base.ref == 'main' || needs.screen.outputs.changed == 'true'))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FIDELITY_MILESTONE: M9
      FIDELITY_REFS: M1,M2,M3,M4,M5,M6,M8,M9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Same native-module gotchas as the windows job.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install scoped BDD tooling when present
        if: hashFiles('test/bdd/package.json') != ''
        run: pnpm --dir test/bdd install --frozen-lockfile
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      - name: Build better-sqlite3 for Node (unit tests)
        run: pnpm rebuild:node
      - name: Unit, article and fidelity tests (JSON for the report)
        id: unit
        continue-on-error: true
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=golden/out/results/vitest.json
      - name: Lint (JSON for the report)
        id: lint
        continue-on-error: true
        run: pnpm exec eslint . -f json -o golden/out/results/eslint.json
      - run: pnpm build
      - name: Rebuild native modules for Electron
        run: pnpm rebuild:electron
      - name: Render the milestones' references twice (FID-03) and record the runner (FID-04)
        id: render
        continue-on-error: true
        shell: bash
        run: pnpm golden:render --milestone "$FIDELITY_REFS" --determinism
      # Also runs the Blueprint and walkthrough capture specs (test/fidelity/bp, test/fidelity/ux) that write golden/out/app.
      - name: E2E with FID-14 and Tier B (JSON for the report)
        id: e2e
        continue-on-error: true
        run: pnpm test:e2e
      - name: Page state at each failed e2e test
        if: steps.e2e.outcome == 'failure'
        shell: bash
        run: bash scripts/print-error-context.sh
      - name: Tier R for the steps built so far
        id: tierr
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          captures=(golden/out/app/*.json)
          if [ ${#captures[@]} -eq 0 ]; then echo "No app captures yet: no $FIDELITY_MILESTONE step is built, Tier R has nothing to compare"; exit 0; fi
          status=0
          for app in "${captures[@]}"; do
            name="$(basename "$app" .json)"; id="${name%.*}"; theme="${name##*.}"
            case "$id" in UX-*) fam=ux ;; *) fam=bp ;; esac
            pnpm -s tier-r --ref "golden/ref/$fam/$id.json" --app "$app" --theme "$theme" || status=1
          done
          exit $status
      - name: Fidelity report
        if: always()
        shell: bash
        env:
          FOO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm tsx scripts/fidelity-report.ts --milestone "$FIDELITY_MILESTONE"
      - name: Push evidence to the evidence branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MILESTONE: ${{ env.FIDELITY_MILESTONE }}
        run: bash scripts/push-evidence.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evidence
          path: |
            qa-evidence/
            golden/ref/
            golden/out/
            golden/runner.json
            test-results/
          if-no-files-found: ignore
      - name: Fail when a check failed
        if: steps.unit.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.render.outcome == 'failure' || steps.e2e.outcome == 'failure' || steps.tierr.outcome == 'failure'
        shell: bash
        run: |
          echo "unit=${{ steps.unit.outcome }} lint=${{ steps.lint.outcome }} render=${{ steps.render.outcome }} e2e=${{ steps.e2e.outcome }} tierR=${{ steps.tierr.outcome }}"
          exit 1
