# Spec: foo-plan §2 (CI), §4 (test strategy), §5 M0. windows-latest is the source of truth; ubuntu-latest is the fast lane.
name: CI

on:
  push:
    branches: [main]
  # Windows minutes count double against the Actions quota (Vikas, 2026-10-19, docs/build-method.md §1a): a ticket PR into a
  # milestone branch runs the fast lane, plus the golden lane when it is ready and touches the screen; the full Windows
  # suite runs on PRs into main (milestone close-out), on main, and by hand (workflow_dispatch). A draft PR runs only the
  # fast lane.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      testing_lanes:
        description: Additional test lanes approved by Vikas on 2026-10-22; standard runs the existing CI suite
        type: choice
        options: [standard, all, bdd, eval, windows, installer, soak, quality, perf, mutation]
        default: standard
      lane_b_ref:
        description: Exact Lane B commit or branch to test
        default: codex/lane-b-2026-10-22
      lane_c_ref:
        description: Exact Lane C commit or branch to test
        default: codex/lane-c-2026-10-22
      lane_e_ref:
        description: Exact Lane E commit or branch to test
        default: codex/lane-e-2026-10-22
      lane_f_ref:
        description: Exact Lane F commit or branch to test
        default: codex/lane-f-2026-10-22

# The PR action is in the group: marking a PR ready right after a push must not let the push's run (draft payload, no
# golden lane) cancel the ready run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action }}-${{ inputs.testing_lanes || 'standard' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lane-e-perf-probes:
    name: Lane E repeated UI performance probes (diagnostic)
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.testing_lanes == 'perf'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d04a9f9105e42aef0b4a22238285a9007635c3e
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm build
      - run: pnpm rebuild:electron
      - name: Execute all four diagnostic probes with unchanged assertions
        id: probes
        continue-on-error: true
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'perf-evidence'
          New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
          @"
          testedSha=$(git rev-parse HEAD)
          workflowSha=$env:GITHUB_SHA
          scope=existing source-app probes; no reference-laptop, release/reboot, full E.1 dataset or 225-percent acceptance claim
          PERF-01=titlebar smoke with existing 15000ms assertion, not the 2000ms reference budget
          "@ | Set-Content (Join-Path $evidenceRoot 'scope.txt')
          $probes = @(
            @{ id = 'PERF-01'; file = 'test/e2e/m0-window.spec.ts'; pattern = 'PERF-01 smoke' },
            @{ id = 'PERF-02'; file = 'test/e2e/m2-composer.spec.ts'; pattern = 'PERF-02' },
            @{ id = 'PERF-03'; file = 'test/e2e/m1-shell.spec.ts'; pattern = 'PERF-03:' },
            @{ id = 'PERF-04'; file = 'test/e2e/m2-messages.spec.ts'; pattern = 'PERF-04' }
          )
          $anyFailed = $false
          foreach ($probe in $probes) {
            $probeRoot = Join-Path $evidenceRoot $probe.id
            $outputRoot = Join-Path $env:RUNNER_TEMP ('perf-output-' + $probe.id)
            New-Item -ItemType Directory -Force $probeRoot | Out-Null
            $jsonSource = Join-Path $env:GITHUB_WORKSPACE 'test-results/e2e.json'
            if (Test-Path -LiteralPath $jsonSource -PathType Leaf) { Remove-Item -LiteralPath $jsonSource }
            $probeExit = 1
            try {
              pnpm exec playwright test $probe.file --grep $probe.pattern --repeat-each=20 --workers=1 --retries=0 --output "$outputRoot" 2>&1 | Tee-Object (Join-Path $probeRoot 'probe.log')
              $probeExit = $LASTEXITCODE
            } catch {
              $_.Exception.Message | Add-Content (Join-Path $probeRoot 'probe.log')
            }
            [string]$probeExit | Set-Content (Join-Path $probeRoot 'exit.txt')
            if ($probeExit -ne 0) { $anyFailed = $true }
            if (Test-Path -LiteralPath $jsonSource -PathType Leaf) {
              Copy-Item -LiteralPath $jsonSource -Destination (Join-Path $probeRoot 'playwright.json')
            }
            $imageIndex = 0
            if (Test-Path -LiteralPath $outputRoot -PathType Container) {
              Get-ChildItem -LiteralPath $outputRoot -Recurse -File -Filter '*.png' | ForEach-Object {
                $imageIndex++
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $probeRoot ("screen-{0:D4}.png" -f $imageIndex))
              }
            }
          }
          if ($anyFailed) { exit 1 }
      - name: Check allowlisted diagnostic artifacts before upload
        id: artifact_check
        if: always()
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'perf-evidence'
          if (-not (Test-Path -LiteralPath $evidenceRoot -PathType Container)) { throw 'No performance execution evidence exists' }
          foreach ($file in Get-ChildItem -LiteralPath $evidenceRoot -Recurse -File) {
            if ($file.Extension -notin @('.log', '.json', '.png', '.txt')) { throw 'Unexpected artifact extension' }
            if ($file.Extension -eq '.png') { continue }
            $body = Get-Content -LiteralPath $file.FullName -Raw
            if ($body -match '(?i)sk-ant-[a-z0-9_-]{12,}|sk-proj-[a-z0-9_-]{12,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|(?:ANTHROPIC_API_KEY|OPENAI_API_KEY)\s*[=:]\s*["'']?[a-z0-9_-]{12,}') {
              throw 'Credential pattern detected; artifact upload blocked'
            }
          }
      - name: Upload diagnostic performance evidence
        if: always() && steps.artifact_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lane-e-perf-probes-${{ github.run_id }}
          path: ${{ runner.temp }}/perf-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Fail on failed or missing probe execution
        if: always()
        shell: pwsh
        run: |
          foreach ($id in @('PERF-01', 'PERF-02', 'PERF-03', 'PERF-04')) {
            $probeRoot = Join-Path $env:RUNNER_TEMP "perf-evidence/$id"
            $exitFile = Join-Path $probeRoot 'exit.txt'
            if (-not (Test-Path -LiteralPath $exitFile -PathType Leaf)) { throw "$id did not complete" }
            if ((Get-Content -LiteralPath $exitFile -Raw).Trim() -ne '0') { throw "$id failed; see preserved probe evidence" }
            if (-not (Test-Path -LiteralPath (Join-Path $probeRoot 'playwright.json') -PathType Leaf)) { throw "$id has no result JSON" }
          }

  lane-f-mutation:
    name: Lane F mutation (${{ matrix.area }})
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'quality' || inputs.testing_lanes == 'mutation')
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        area: [shared-redaction, shared-state, engine-ai, engine-jobs, engine-web, main, renderer]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.lane_f_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild:node
      - run: npm ci --prefix scripts/audit
      - name: Validate complete per-area mutation manifest
        shell: pwsh
        env:
          MUTATION_AREA: ${{ matrix.area }}
        run: |
          New-Item -ItemType Directory -Force reports/mutation | Out-Null
          git rev-parse HEAD | Set-Content reports/mutation/tested-sha.txt
          pnpm exec tsx scripts/audit/mutation-preflight.ts 2>&1 | Tee-Object reports/mutation/preflight.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsx scripts/audit/preload-allowlist-preflight.ts 2>&1 | Tee-Object reports/mutation/preload-preflight.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $configPath = 'stryker.lane-f-' + $env:MUTATION_AREA + '-ci.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if ($config.thresholds.break -ne 70 -or $config.concurrency -ne 1) { throw 'Mutation threshold or concurrency differs from approved configuration' }
          $config.mutate | Set-Content reports/mutation/selected-files.txt
      - name: Execute mutations with unchanged acceptance thresholds
        shell: pwsh
        env:
          MUTATION_AREA: ${{ matrix.area }}
        run: |
          $configPath = 'stryker.lane-f-' + $env:MUTATION_AREA + '-ci.json'
          scripts/audit/node_modules/.bin/stryker.cmd run $configPath
          exit $LASTEXITCODE
      - name: Summarize actual mutation output
        if: always()
        shell: pwsh
        env:
          MUTATION_AREA: ${{ matrix.area }}
        run: |
          $reportPath = 'reports/mutation/lane-f-' + $env:MUTATION_AREA + '.json'
          if (Test-Path -LiteralPath $reportPath) {
            pnpm exec tsx scripts/audit/mutation-report.ts --input $reportPath --out reports/mutation/summary.json
            exit $LASTEXITCODE
          }
          Write-Warning 'No completed mutation JSON exists; no score can be claimed.'
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-f-mutation-${{ matrix.area }}-${{ github.run_id }}
          retention-days: 14
          path: |
            reports/mutation/*.json
            reports/mutation/*.txt

  lane-f-boundaries:
    name: Lane F recovery, corruption and privacy boundaries
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'quality')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.lane_f_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild:node
      - name: Record revision
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/lane-f" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/lane-f/tested-sha.txt"
      - name: Execute recovery and corrupt database fixtures
        id: chaos
        continue-on-error: true
        run: pnpm exec tsx scripts/audit/chaos.ts --out "${{ runner.temp }}/lane-f/chaos.json"
      - name: Execute privacy boundary checks
        id: privacy
        continue-on-error: true
        run: pnpm exec tsx scripts/audit/privacy-network.ts --out "${{ runner.temp }}/lane-f/privacy.json"
      - name: Execute focused audit regression tests
        id: audit
        continue-on-error: true
        run: pnpm exec vitest run --config scripts/audit/vitest.mutation.config.ts --maxWorkers=1 --no-file-parallelism scripts/audit/cloud-outbound.test.ts scripts/audit/mutation-report.test.ts
      - name: Upload boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-f-boundaries-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/lane-f/
      - name: Preserve observed failures
        if: always() && (steps.chaos.outcome == 'failure' || steps.privacy.outcome == 'failure' || steps.audit.outcome == 'failure')
        run: exit 1

  lane-c-eval:
    name: Lane C evaluation and injection boundaries
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'eval')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.lane_c_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild:node
      - run: python -m pip install --target test/eval/.deps -r test/eval/requirements.txt
      - name: Record evaluated revision
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/lane-c" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/lane-c/tested-sha.txt"
      - name: Run evaluation and injection boundary tests
        id: boundaries
        continue-on-error: true
        shell: pwsh
        run: pnpm exec vitest run --config test/eval/vitest.config.ts --maxWorkers=1 --reporter=default --reporter=json "--outputFile.json=$env:RUNNER_TEMP/lane-c/vitest.json"
      - name: Run DeepEval against production boundary fixtures
        id: deepeval
        continue-on-error: true
        shell: pwsh
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
        run: |
          New-Item -ItemType Directory -Force test/eval/results | Out-Null
          pnpm exec tsx test/eval/production-cases.ts | Out-File test/eval/results/production-cases.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = (Resolve-Path test/eval/.deps).Path
          python test/eval/deepeval_adapter.py 2>&1 | Tee-Object "$env:RUNNER_TEMP/lane-c/deepeval.log"
          exit $LASTEXITCODE
      - name: Upload actual evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-eval-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/lane-c/
            test/eval/results/production-cases.json
      - name: Preserve failed category status
        if: always() && (steps.boundaries.outcome == 'failure' || steps.deepeval.outcome == 'failure')
        run: exit 1

  lane-b-bdd:
    name: Lane B BDD (${{ matrix.mode }})
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'bdd')
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [pretend, real]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.lane_b_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir test/bdd install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm build
      - run: pnpm rebuild:electron
      - name: Install Claude CLI for real BDD
        if: matrix.mode == 'real'
        run: npm install -g @anthropic-ai/claude-code
      - name: Record tested revision and create isolated provider home
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test/bdd/results | Out-Null
          git rev-parse HEAD | Set-Content test/bdd/results/tested-sha.txt
          $providerHome = Join-Path $env:RUNNER_TEMP 'foo-bdd-ai-home'
          New-Item -ItemType Directory -Force $providerHome | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $providerHome 'AppData/Roaming'), (Join-Path $providerHome 'AppData/Local') | Out-Null
          "FOO_BDD_REAL_AI_HOME=$providerHome" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute BDD scenarios for the selected mode
        env:
          FOO_BDD_AI_MODE: ${{ matrix.mode }}
          FOO_BDD_REAL_AI_PROVIDER: claude-cli
          ANTHROPIC_API_KEY: ${{ matrix.mode == 'real' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
        run: |
          if ($env:FOO_BDD_AI_MODE -eq 'real') {
            pnpm --dir test/bdd test:real
          } else {
            pnpm --dir test/bdd test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload BDD execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-b-bdd-${{ matrix.mode }}-${{ github.run_id }}
          retention-days: 14
          path: |
            test/bdd/results/
            test/bdd/test-results/
            test-results/

  fast:
    if: github.event_name != 'workflow_dispatch' || inputs.testing_lanes == 'standard'
    name: Fast lane (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fid-guard reads the PR's commits and diff
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install scoped BDD tooling when present
        if: hashFiles('test/bdd/package.json') != ''
        run: pnpm --dir test/bdd install --frozen-lockfile
      - run: pnpm spec:verify
      - name: FID-02 / FID-06 / FID-19 guard (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm fid:guard
      - name: FID-18 trace matrix
        run: pnpm trace:check
      - run: pnpm check:copy
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Does this PR change what the screen draws? Then a ticket PR also runs the golden lane (its picture checks).
  screen:
    if: github.event_name != 'workflow_dispatch' || inputs.testing_lanes == 'standard'
    name: Screen change check
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(src/renderer/|src/shared/copy/|design/|golden/|test/fidelity/|index\.html)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    # Split into 4 parallel shards (Vikas, option A, 2026-10-19 06:53Z): same tests, a quarter of the wall time each.
    # Shard 1 also typechecks, packages and uploads the app for manual testing.
    name: Full suite (windows-latest, shard ${{ matrix.shard }}/4)
    if: (github.event_name != 'workflow_dispatch' || inputs.testing_lanes == 'standard') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.base.ref == 'main'))
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # better-sqlite3 always compiles on install. pnpm's bundled node-gyp 11 cannot find Visual Studio 2026 (v18)
      # on the runner, so install without scripts and compile with the pinned node-gyp 12.4, which knows VS 2026.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install scoped BDD tooling when present
        if: hashFiles('test/bdd/package.json') != ''
        run: pnpm --dir test/bdd install --frozen-lockfile
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      - name: Build better-sqlite3 for Node (unit tests)
        run: pnpm rebuild:node
      - run: pnpm typecheck
        if: matrix.shard == 1
      - name: Unit, article and fidelity tests
        run: pnpm test --shard=${{ matrix.shard }}/4
      - run: pnpm build
      - name: Rebuild native modules for Electron
        run: pnpm rebuild:electron
      - name: E2E (Playwright for Electron)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      # Agents cannot download CI artifacts, so a failed e2e test's page state goes in the log, where they can read it.
      - name: Page state at each failed e2e test
        if: failure()
        shell: bash
        run: bash scripts/print-error-context.sh
      - name: Package (unpacked)
        if: matrix.shard == 1
        run: pnpm package:dir
      - name: No test hooks in the production build (08-3 §22.1)
        if: matrix.shard == 1
        shell: bash
        run: |
          for needle in "__fooTest" "test:clock" "test:seed"; do
            if grep -a -q "$needle" dist/win-unpacked/resources/app.asar; then echo "$needle found in app.asar"; exit 1; fi
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-evidence-windows-${{ matrix.shard }}
          path: |
            qa-evidence/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      # A ready-to-run copy for manual testing on Vikas's PC: unzip, open foo.exe (unsigned for testers).
      - name: Upload the app for manual testing
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: foo-windows-app
          path: dist/win-unpacked/
          retention-days: 14

  # 11-fidelity §11.2 golden lane: renders the current milestone's references in Electron's Chromium, runs Tier R/Tier B
  # for built steps, writes the fidelity report and pushes the evidence to the `evidence` branch (agents cannot read CI
  # artifacts). FIDELITY_MILESTONE names the milestone this branch builds (the report and the evidence folder); bump it when
  # the next milestone starts. FIDELITY_REFS lists every milestone whose app captures still run, so Tier R finds a reference
  # for each capture (M1's Blueprint captures keep running until they are blessed into Tier B).
  golden:
    name: Golden lane (windows-latest)
    needs: screen
    if: (github.event_name != 'workflow_dispatch' || inputs.testing_lanes == 'standard') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.pull_request.base.ref == 'main' || needs.screen.outputs.changed == 'true')))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FIDELITY_MILESTONE: M9
      FIDELITY_REFS: M1,M2,M3,M4,M5,M6,M8,M9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Same native-module gotchas as the windows job.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install scoped BDD tooling when present
        if: hashFiles('test/bdd/package.json') != ''
        run: pnpm --dir test/bdd install --frozen-lockfile
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      - name: Build better-sqlite3 for Node (unit tests)
        run: pnpm rebuild:node
      - name: Unit, article and fidelity tests (JSON for the report)
        id: unit
        continue-on-error: true
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=golden/out/results/vitest.json
      - name: Lint (JSON for the report)
        id: lint
        continue-on-error: true
        run: pnpm exec eslint . -f json -o golden/out/results/eslint.json
      - run: pnpm build
      - name: Rebuild native modules for Electron
        run: pnpm rebuild:electron
      - name: Render the milestones' references twice (FID-03) and record the runner (FID-04)
        id: render
        continue-on-error: true
        shell: bash
        run: pnpm golden:render --milestone "$FIDELITY_REFS" --determinism
      # Also runs the Blueprint and walkthrough capture specs (test/fidelity/bp, test/fidelity/ux) that write golden/out/app.
      - name: E2E with FID-14 and Tier B (JSON for the report)
        id: e2e
        continue-on-error: true
        run: pnpm test:e2e
      - name: Page state at each failed e2e test
        if: steps.e2e.outcome == 'failure'
        shell: bash
        run: bash scripts/print-error-context.sh
      - name: Tier R for the steps built so far
        id: tierr
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          captures=(golden/out/app/*.json)
          if [ ${#captures[@]} -eq 0 ]; then echo "No app captures yet: no $FIDELITY_MILESTONE step is built, Tier R has nothing to compare"; exit 0; fi
          status=0
          for app in "${captures[@]}"; do
            name="$(basename "$app" .json)"; id="${name%.*}"; theme="${name##*.}"
            case "$id" in UX-*) fam=ux ;; *) fam=bp ;; esac
            pnpm -s tier-r --ref "golden/ref/$fam/$id.json" --app "$app" --theme "$theme" || status=1
          done
          exit $status
      - name: Fidelity report
        if: always()
        shell: bash
        env:
          FOO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm tsx scripts/fidelity-report.ts --milestone "$FIDELITY_MILESTONE"
      - name: Push evidence to the evidence branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MILESTONE: ${{ env.FIDELITY_MILESTONE }}
        run: bash scripts/push-evidence.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evidence
          path: |
            qa-evidence/
            golden/ref/
            golden/out/
            golden/runner.json
            test-results/
          if-no-files-found: ignore
      - name: Fail when a check failed
        if: steps.unit.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.render.outcome == 'failure' || steps.e2e.outcome == 'failure' || steps.tierr.outcome == 'failure'
        shell: bash
        run: |
          echo "unit=${{ steps.unit.outcome }} lint=${{ steps.lint.outcome }} render=${{ steps.render.outcome }} e2e=${{ steps.e2e.outcome }} tierR=${{ steps.tierr.outcome }}"
          exit 1

  lane-e-installer:
    name: Lane E Windows installer, upgrade, UI and screenshot (draft PR)
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'windows' || inputs.testing_lanes == 'installer')
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.lane_e_ref }}
      - name: Record tested revision and workflow revision
        shell: pwsh
        env:
          LANE_E_REF: ${{ inputs.lane_e_ref }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LANE_E_REF)) { throw 'lane_e_ref input is required' }
          $expected = (git rev-parse --verify "$($env:LANE_E_REF)^{commit}" 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expected)) { throw "lane_e_ref is not a resolvable commit: $env:LANE_E_REF" }
          $expected = $expected.Trim()
          $tested = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tested)) { throw 'could not resolve tested HEAD' }
          if ($expected -ne $tested) { throw "checkout ref resolved to $expected but tested HEAD is $tested" }
          $revisionDir = Join-Path $env:RUNNER_TEMP 'lane-e-revision'
          New-Item -ItemType Directory -Force -Path $revisionDir | Out-Null
          @"
          testedSha=$tested
          workflowSha=$env:GITHUB_SHA
          requestedRef=$env:LANE_E_REF
          "@ | Set-Content (Join-Path $revisionDir 'revision.txt') -Encoding utf8
          Add-Content $env:GITHUB_ENV "LANE_E_TESTED_SHA=$tested"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the PR97 UI automation dependency
        shell: pwsh
        run: pip install pywinauto==0.6.9
      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the Electron binary
        shell: pwsh
        run: node node_modules/electron/install.js
      - name: Build better-sqlite3 for Node
        shell: pwsh
        run: pnpm rebuild:node

      - name: Build current release and NSIS installer
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'lane-e-build'
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          corepack.cmd pnpm build 2>&1 | Tee-Object (Join-Path $buildRoot 'current-build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack.cmd pnpm rebuild:electron 2>&1 | Tee-Object (Join-Path $buildRoot 'current-rebuild.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack.cmd pnpm exec electron-builder --win nsis --publish never 2>&1 | Tee-Object (Join-Path $buildRoot 'current-installer.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist') -Filter '*Setup*.exe' -File | Where-Object { $_.Name -notmatch '\.\.uninstaller\.exe$' })
          if ($installer.Count -ne 1) { Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist'); throw "expected one current installer, got $($installer.Count)" }
          $currentInstallerPath = Join-Path $env:RUNNER_TEMP 'foo-current-Setup.exe'
          if (Test-Path -LiteralPath $currentInstallerPath) { throw "expected fresh installer path: $currentInstallerPath" }
          Copy-Item $installer[0].FullName $currentInstallerPath
          $unpacked = Join-Path $env:RUNNER_TEMP 'foo-current-unpacked'
          if (Test-Path -LiteralPath $unpacked) { throw "expected fresh unpacked path: $unpacked" }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'dist\win-unpacked') $unpacked -Recurse

      - name: Build exact 04f01dd old release and NSIS installer
        shell: pwsh
        env:
          OLD_BUILD_SHA: 04f01dd9fb3108cbbce8ff6df211d3a389c16977
        run: |
          $old = $env:OLD_BUILD_SHA
          git cat-file -e "$old^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags origin $old
            if ($LASTEXITCODE -ne 0) { throw "could not fetch old release $old" }
          }
          $oldRoot = Join-Path $env:RUNNER_TEMP 'foo-old-04f01dd'
          if (Test-Path -LiteralPath $oldRoot) { throw "expected fresh old worktree path: $oldRoot" }
          git worktree add --detach $oldRoot $old
          if ($LASTEXITCODE -ne 0) { throw "could not create old worktree $oldRoot" }
          try {
            Push-Location $oldRoot
            corepack.cmd pnpm install --frozen-lockfile --ignore-scripts 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'lane-e-build\old-install.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node node_modules/electron/install.js 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'lane-e-build\old-electron.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            corepack.cmd pnpm rebuild:node 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'lane-e-build\old-rebuild-node.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            corepack.cmd pnpm build 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'lane-e-build\old-build.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            corepack.cmd pnpm rebuild:electron 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'lane-e-build\old-rebuild-electron.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            corepack.cmd pnpm exec electron-builder --win nsis --publish never 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'lane-e-build\old-installer.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installer = @(Get-ChildItem -LiteralPath (Join-Path $oldRoot 'dist') -Filter '*Setup*.exe' -File | Where-Object { $_.Name -notmatch '\.\.uninstaller\.exe$' })
            if ($installer.Count -ne 1) { Get-ChildItem (Join-Path $oldRoot 'dist'); throw "expected one old installer, got $($installer.Count)" }
            $oldInstallerPath = Join-Path $env:RUNNER_TEMP 'foo-04f01dd-Setup.exe'
            if (Test-Path -LiteralPath $oldInstallerPath) { throw "expected fresh old installer path: $oldInstallerPath" }
            Copy-Item $installer[0].FullName $oldInstallerPath
          } finally {
            Pop-Location
          }

      - name: Fetch pinned PR97 Windows check source
        shell: pwsh
        env:
          PR97_REF: 9e599e343eb9559ab3af45b8e92b1f04a7d804bf
        run: |
          git cat-file -e "$env:PR97_REF^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags origin $env:PR97_REF
            if ($LASTEXITCODE -ne 0) { throw "could not fetch pinned PR97 source" }
          }
          $pr97 = Join-Path $env:RUNNER_TEMP 'pr97-source'
          New-Item -ItemType Directory -Force -Path $pr97 | Out-Null
          foreach ($name in @('run-checks.ps1', 'credman-check.js', 'window_checks.py')) {
            $value = (git show "$($env:PR97_REF):test/windows/$name" | Out-String)
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) { throw "missing PR97 file $name" }
            [IO.File]::WriteAllText((Join-Path $pr97 $name), $value, [Text.Encoding]::UTF8)
          }
          $env:PR97_REF | Set-Content (Join-Path $pr97 'source-ref.txt') -Encoding utf8

      - name: Run PR97 installer, UI, AUMID and Credential Manager checks
        id: pr97
        continue-on-error: true
        shell: powershell
        env:
          PR97_SOURCE: ${{ runner.temp }}\pr97-source
          CURRENT_INSTALLER: ${{ runner.temp }}\foo-current-Setup.exe
          PR97_OUT: ${{ runner.temp }}\pr97
        run: |
          New-Item -ItemType Directory -Force -Path $env:PR97_OUT | Out-Null
          & (Join-Path $env:PR97_SOURCE 'run-checks.ps1') -Installer $env:CURRENT_INSTALLER -Out $env:PR97_OUT
          $pr97Exit = $LASTEXITCODE
          "PR97 exit=$pr97Exit" | Set-Content (Join-Path $env:PR97_OUT 'exit.txt') -Encoding utf8
          if ($pr97Exit -ne 0) { throw "PR97 checks exited $pr97Exit" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:PR97_OUT 'results.json') -PathType Leaf)) { throw 'PR97 emitted no results.json; no pass was inferred.' }

      - name: Run isolated first-run and old-to-current upgrade fixtures
        id: fixtures
        continue-on-error: true
        shell: pwsh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $currentSha = $env:LANE_E_TESTED_SHA
          if ([string]::IsNullOrWhiteSpace($currentSha)) { throw 'tested SHA was not recorded after checkout' }
          $fixtureParameters = @{
            Out = "$env:RUNNER_TEMP\lane-e-results"
            Pr97Results = "$env:RUNNER_TEMP\pr97\results.json"
            Pr97BuildSha = $currentSha
            Pr97EvidenceUrl = $env:RUN_URL
            PreviousInstaller = "$env:RUNNER_TEMP\foo-04f01dd-Setup.exe"
            CurrentInstaller = "$env:RUNNER_TEMP\foo-current-Setup.exe"
            PreviousBuildSha = '04f01dd9fb3108cbbce8ff6df211d3a389c16977'
            CurrentBuildSha = $currentSha
          }
          & test/windows/lane-e-windows.ps1 @fixtureParameters
          $laneExit = $LASTEXITCODE
          "lane-e-windows exit=$laneExit" | Set-Content "$env:RUNNER_TEMP\lane-e-results\exit.txt" -Encoding utf8
          if ($laneExit -eq 1 -or $laneExit -gt 2) { throw "lane-e-windows exited $laneExit" }

      - name: Capture actual packaged-app screenshot on isolated CI profile
        id: screenshot
        if: always()
        shell: pwsh
        run: |
          $shotRoot = Join-Path $env:RUNNER_TEMP 'lane-e-screenshots'
          $installRoot = Join-Path $shotRoot 'install'
          $dataRoot = Join-Path $shotRoot 'data'
          $localRoot = Join-Path $shotRoot 'local'
          $appData = Join-Path $shotRoot 'appdata'
          $localAppData = Join-Path $shotRoot 'localappdata'
          foreach ($path in @($shotRoot, $installRoot, $dataRoot, $localRoot, $appData, $localAppData, (Join-Path $shotRoot 'runtime-out'))) {
            if (Test-Path -LiteralPath $path) { throw "expected fresh screenshot path: $path" }
          }
          New-Item -ItemType Directory -Path $shotRoot, $installRoot, $dataRoot, $localRoot, $appData, $localAppData, (Join-Path $shotRoot 'runtime-out') | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'foo-current-Setup.exe'
          $install = Start-Process $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "screenshot fixture install failed with exit $($install.ExitCode)" }
          $exe = Join-Path $installRoot 'foo.exe'
          $si = [Diagnostics.ProcessStartInfo]::new()
          $si.FileName = $exe
          $si.UseShellExecute = $false
          $si.CreateNoWindow = $true
          $si.EnvironmentVariables['FOO_TEST'] = '1'
          $si.EnvironmentVariables['FOO_DATA_DIR'] = $dataRoot
          $si.EnvironmentVariables['FOO_LOCAL_DIR'] = $localRoot
          $si.EnvironmentVariables['FOO_OUT_DIR'] = (Join-Path $shotRoot 'runtime-out')
          $si.EnvironmentVariables['APPDATA'] = $appData
          $si.EnvironmentVariables['LOCALAPPDATA'] = $localAppData
          $app = [Diagnostics.Process]::Start($si)
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while (-not $app.HasExited -and $app.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
            }
            if ($app.HasExited -or $app.MainWindowHandle -eq [IntPtr]::Zero) { throw 'packaged app did not expose a window for screenshot' }
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class LaneEScreenshotWindow {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
            [LaneEScreenshotWindow]::SetForegroundWindow($app.MainWindowHandle) | Out-Null
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            Start-Sleep -Milliseconds 500
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = [Drawing.Bitmap]::new($screen.Width, $screen.Height)
            $graphics = [Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($screen.Location, [Drawing.Point]::Empty, $screen.Size)
              $bitmap.Save((Join-Path $shotRoot 'packaged-foo-window.png'), [Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          } finally {
            if ($app -and -not $app.HasExited) { $app.CloseMainWindow(); if (-not $app.WaitForExit(15000)) { $app.Kill(); $app.WaitForExit() } }
            $uninstaller = Join-Path $installRoot 'Uninstall foo.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait -WindowStyle Hidden | Out-Null }
          }
          if (-not (Test-Path (Join-Path $shotRoot 'packaged-foo-window.png') -PathType Leaf)) { throw 'no actual screenshot was written' }

      - name: Summarize Lane E evidence
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "### Lane E ($env:GITHUB_SHA)"
          foreach ($file in @(
            "$env:RUNNER_TEMP\pr97\SUMMARY.md",
            "$env:RUNNER_TEMP\lane-e-results\lane-e-windows.md",
            "$env:RUNNER_TEMP\lane-e-results\first-run\lane-e-first-run.md",
            "$env:RUNNER_TEMP\lane-e-results\upgrade\lane-e-upgrade.md",
            "$env:RUNNER_TEMP\lane-e-live-partial\lane-e-live-producer-pretend.json",
            "$env:RUNNER_TEMP\lane-e-soak-partial\lane-e-soak-pretend.md",
            "$env:RUNNER_TEMP\lane-e-performance\lane-e-performance-pending.md"
          )) {
            if (Test-Path $file) { Add-Content $env:GITHUB_STEP_SUMMARY (Get-Content $file -Raw) }
          }

      - name: Fail only on observed installer failures
        if: always()
        shell: pwsh
        env:
          PR97_OUTCOME: ${{ steps.pr97.outcome }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          SCREENSHOT_OUTCOME: ${{ steps.screenshot.outcome }}
        run: |
          $errors = [Collections.Generic.List[string]]::new()
          foreach ($outcome in @(@{ Name = 'PR97'; Value = $env:PR97_OUTCOME }, @{ Name = 'fixtures'; Value = $env:FIXTURES_OUTCOME }, @{ Name = 'screenshot'; Value = $env:SCREENSHOT_OUTCOME })) {
            if ($outcome.Value -eq 'failure') { $errors.Add("$($outcome.Name) step failed") }
          }
          foreach ($file in @(
            "$env:RUNNER_TEMP\pr97\results.json",
            "$env:RUNNER_TEMP\lane-e-results\lane-e-windows.json",
            "$env:RUNNER_TEMP\lane-e-results\first-run\lane-e-first-run.json",
            "$env:RUNNER_TEMP\lane-e-results\upgrade\lane-e-upgrade.json"
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }
            try {
              $value = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              foreach ($item in @($value)) { if ($item.result -eq 'fail' -or $item.status -eq 'fail') { $errors.Add("$($file): $($item.check ?? $item.id)") } }
            } catch { $errors.Add("could not parse expected report $($file): $($_.Exception.Message)") }
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'Installer evidence has no observed failure rows; explicit blocked/gap rows remain in reports.'
      - name: Upload Lane E reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-e-installer-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/lane-e-build/**
            ${{ runner.temp }}/pr97/**
            ${{ runner.temp }}/pr97-source/source-ref.txt
            ${{ runner.temp }}/lane-e-results/**
            ${{ runner.temp }}/lane-e-revision/revision.txt
            ${{ runner.temp }}/lane-e-screenshots/packaged-foo-window.png

  lane-e-soak:
    name: Lane E Windows 1h partial soak (diagnostic)
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'windows' || inputs.testing_lanes == 'soak')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.lane_e_ref }}
      - name: Record tested revision and workflow revision
        shell: pwsh
        env:
          LANE_E_REF: ${{ inputs.lane_e_ref }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LANE_E_REF)) { throw 'lane_e_ref input is required' }
          $expected = (git rev-parse --verify "$($env:LANE_E_REF)^{commit}" 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expected)) { throw "lane_e_ref is not a resolvable commit: $env:LANE_E_REF" }
          $expected = $expected.Trim()
          $tested = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tested)) { throw 'could not resolve tested HEAD' }
          if ($expected -ne $tested) { throw "checkout ref resolved to $expected but tested HEAD is $tested" }
          $revisionDir = Join-Path $env:RUNNER_TEMP 'lane-e-revision'
          New-Item -ItemType Directory -Force -Path $revisionDir | Out-Null
          @"
          testedSha=$tested
          workflowSha=$env:GITHUB_SHA
          requestedRef=$env:LANE_E_REF
          "@ | Set-Content (Join-Path $revisionDir 'revision.txt') -Encoding utf8
          Add-Content $env:GITHUB_ENV "LANE_E_TESTED_SHA=$tested"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the PR97 UI automation dependency
        shell: pwsh
        run: pip install pywinauto==0.6.9
      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the Electron binary
        shell: pwsh
        run: node node_modules/electron/install.js
      - name: Build better-sqlite3 for Node
        shell: pwsh
        run: pnpm rebuild:node

      - name: Build the isolated source app
        shell: pwsh
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm rebuild:electron
          exit $LASTEXITCODE
      - name: Run actual one-hour job producer (partial; resource measurements unavailable)
        id: partial_soak
        continue-on-error: true
        shell: pwsh
        run: |
          $partialRoot = Join-Path $env:RUNNER_TEMP 'lane-e-live-partial'
          New-Item -ItemType Directory -Force $partialRoot | Out-Null
          'Only the job-driving app is exercised. Memory and handles under load are not measured by this run.' | Set-Content (Join-Path $partialRoot 'scope.txt')
          pnpm exec tsx test/soak/lane-e-live-producer.ts --out "$partialRoot" --mode pretend --partial --duration-hours 1 2>&1 | Tee-Object (Join-Path $partialRoot 'producer.log')
          $producerExit = $LASTEXITCODE
          "producer exit=$producerExit" | Set-Content (Join-Path $partialRoot 'exit.txt')
          exit $producerExit

      - name: Fail only on observed soak failures
        if: always()
        shell: pwsh
        env:
          SOAK_OUTCOME: ${{ steps.partial_soak.outcome }}
        run: |
          $errors = [Collections.Generic.List[string]]::new()
          if ($env:SOAK_OUTCOME -eq 'failure') { $errors.Add('partial soak step failed') }
          foreach ($dir in @("$env:RUNNER_TEMP\lane-e-live-partial", "$env:RUNNER_TEMP\lane-e-soak-partial")) {
            if (-not (Test-Path -LiteralPath $dir -PathType Container)) { continue }
            foreach ($file in Get-ChildItem -LiteralPath $dir -Filter '*.json' -File -ErrorAction SilentlyContinue) {
              try {
                $value = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
                foreach ($item in @($value)) { if ($item.result -eq 'fail' -or $item.status -eq 'fail') { $errors.Add("$($file.FullName): $($item.check ?? $item.id)") } }
              } catch { $errors.Add("could not parse soak report $($file.FullName): $($_.Exception.Message)") }
            }
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'Partial soak evidence is explicit; this does not claim the unproven 8h acceptance.'
      - name: Upload Lane E soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-e-soak-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/lane-e-build/**
            ${{ runner.temp }}/lane-e-live-partial/*.json
            ${{ runner.temp }}/lane-e-live-partial/*.log
            ${{ runner.temp }}/lane-e-live-partial/*.txt
            ${{ runner.temp }}/lane-e-soak-partial/**
            ${{ runner.temp }}/lane-e-revision/revision.txt

  lane-e-performance:
    name: Lane E performance evidence (blocked without live adapter)
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (inputs.testing_lanes == 'all' || inputs.testing_lanes == 'windows')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.lane_e_ref }}
      - name: Record tested revision and workflow revision
        shell: pwsh
        env:
          LANE_E_REF: ${{ inputs.lane_e_ref }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LANE_E_REF)) { throw 'lane_e_ref input is required' }
          $expected = (git rev-parse --verify "$($env:LANE_E_REF)^{commit}" 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expected)) { throw "lane_e_ref is not a resolvable commit: $env:LANE_E_REF" }
          $expected = $expected.Trim()
          $tested = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tested)) { throw 'could not resolve tested HEAD' }
          if ($expected -ne $tested) { throw "checkout ref resolved to $expected but tested HEAD is $tested" }
          $revisionDir = Join-Path $env:RUNNER_TEMP 'lane-e-revision'
          New-Item -ItemType Directory -Force -Path $revisionDir | Out-Null
          @"
          testedSha=$tested
          workflowSha=$env:GITHUB_SHA
          requestedRef=$env:LANE_E_REF
          "@ | Set-Content (Join-Path $revisionDir 'revision.txt') -Encoding utf8
          Add-Content $env:GITHUB_ENV "LANE_E_TESTED_SHA=$tested"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run available repository performance test and optional live measurement bundle
        id: performance
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'lane-e-performance'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          corepack.cmd pnpm exec vitest run --config vitest.config.ts test/perf/PERF-06.test.ts 2>&1 | Tee-Object (Join-Path $out 'PERF-06.log')
          $perfSmokeExit = $LASTEXITCODE
          "PERF-06 exit=$perfSmokeExit" | Set-Content (Join-Path $out 'PERF-06.exit.txt') -Encoding utf8
          if ($perfSmokeExit -ne 0) { throw "PERF-06 failed with exit $perfSmokeExit" }
          $perf = Join-Path $env:RUNNER_TEMP 'perf-pretend.json'
          if (Test-Path -LiteralPath $perf -PathType Leaf) {
            & corepack.cmd pnpm exec tsx test/soak/lane-e-performance.ts --measurements $perf --out $out --mode pretend
            $validatorExit = $LASTEXITCODE
            "validator exit=$validatorExit" | Set-Content (Join-Path $out 'validator.exit.txt') -Encoding utf8
            if ($validatorExit -eq 1 -or $validatorExit -gt 2) { throw "performance validator exited $validatorExit" }
          } else {
            @'
          # Lane E performance
          result: blocked
          reason: PERF-06 was attempted from the repository; no live adapter supplied PERF-01..18 and required 225% samples.
          '@ | Set-Content (Join-Path $out 'lane-e-performance-pending.md') -Encoding utf8
            Write-Warning '225% measurement prerequisites are unavailable; PERF-06 result is retained.'
          }
      - name: Fail only on observed performance failures
        if: always()
        shell: pwsh
        env:
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        run: |
          if ($env:PERFORMANCE_OUTCOME -eq 'failure') { throw 'available performance test or validator failed; inspect uploaded evidence' }
          Write-Host 'Available PERF-06 evidence completed; unavailable 225% samples remain explicitly blocked.'
      - name: Upload Lane E performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-e-performance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/lane-e-performance/**
            ${{ runner.temp }}/lane-e-revision/revision.txt
