<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>foo UX Walkthrough</title>
<meta name="description" content="Every foo journey, screen by screen, from install to uninstall.">
<style>
:root{
  --bg-app:#FFFFFF; --bg-sidebar:#F5F5F8; --bg-raised:#FFFFFF; --bg-sunken:#F0F0F4; --bg-hover:#EBEBF0; --bg-pressed:#E2E2E9; --bg-selected:#FFFFFF;
  --line:#E8E8EE; --line-strong:#D4D4DD;
  --fg-1:#0B0B10; --fg-2:#5A5A66; --fg-3:#6E6E7A; --fg-disabled:#A3A3AE;
  --accent:#2B3FD6; --accent-hover:#2334B8; --accent-soft:#E6E9FF; --on-accent:#FFFFFF;
  --bubble-me:#0B0B10; --on-bubble-me:#FFFFFF; --on-bubble-me-2:#B5BDC9; --bubble-foo:#F0F0F4; --on-bubble-foo:#0B0B10; --tick-read-on-me:#8C9BFF;
  --ok:#137044; --ok-soft:#E3F5EA; --warn:#A04807; --warn-soft:#FDF0DD; --bad:#B03224; --bad-soft:#FDE8E5;
  --shadow-1:0 1px 2px rgba(11,11,16,.06); --shadow-4:0 2px 8px rgba(11,11,16,.08); --shadow-16:0 8px 24px rgba(11,11,16,.14); --shadow-28:0 16px 48px rgba(11,11,16,.22);
  --app:"Segoe UI Variable Text","Segoe UI","Nirmala UI",system-ui,sans-serif; --app-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --page:"Geist","Segoe UI",system-ui,sans-serif; --mono:"Geist Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg-app:#0D0D11;--bg-sidebar:#131318;--bg-raised:#1B1B22;--bg-sunken:#16161C;--bg-hover:#22222A;--bg-pressed:#2A2A33;--bg-selected:#1F1F27;--line:#26262E;--line-strong:#34343E;--fg-1:#F1F1F5;--fg-2:#B0B0BC;--fg-3:#8E8E9A;--fg-disabled:#5C5C68;--accent:#8C9BFF;--accent-hover:#A3AFFF;--accent-soft:#1F2452;--on-accent:#0D0D11;--bubble-me:#F1F1F5;--on-bubble-me:#0D0D11;--on-bubble-me-2:#4B4B57;--bubble-foo:#202028;--on-bubble-foo:#F1F1F5;--tick-read-on-me:#2B3FD6;--ok:#4ADE80;--ok-soft:#12301F;--warn:#F5B041;--warn-soft:#3A2A10;--bad:#FF7B6B;--bad-soft:#3A1714;--shadow-1:none;--shadow-4:none;--shadow-16:0 8px 24px rgba(0,0,0,.5);--shadow-28:0 16px 48px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg-app:#0D0D11;--bg-sidebar:#131318;--bg-raised:#1B1B22;--bg-sunken:#16161C;--bg-hover:#22222A;--bg-pressed:#2A2A33;--bg-selected:#1F1F27;--line:#26262E;--line-strong:#34343E;--fg-1:#F1F1F5;--fg-2:#B0B0BC;--fg-3:#8E8E9A;--fg-disabled:#5C5C68;--accent:#8C9BFF;--accent-hover:#A3AFFF;--accent-soft:#1F2452;--on-accent:#0D0D11;--bubble-me:#F1F1F5;--on-bubble-me:#0D0D11;--on-bubble-me-2:#4B4B57;--bubble-foo:#202028;--on-bubble-foo:#F1F1F5;--tick-read-on-me:#2B3FD6;--ok:#4ADE80;--ok-soft:#12301F;--warn:#F5B041;--warn-soft:#3A2A10;--bad:#FF7B6B;--bad-soft:#3A1714;--shadow-1:none;--shadow-4:none;--shadow-16:0 8px 24px rgba(0,0,0,.5);--shadow-28:0 16px 48px rgba(0,0,0,.5);color-scheme:dark}
/* ===== APP MOCK (real tokens) ===== */
.app{font-family:var(--app);font-size:15px;line-height:22px}
.win{position:relative;width:1280px;height:820px;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--bg-app);box-shadow:var(--shadow-28);display:grid;grid-template-rows:32px 1fr;grid-template-columns:340px 1fr 340px}
.tbar{grid-column:1/-1;background:var(--bg-sidebar);display:flex;justify-content:flex-end;align-items:stretch;font-size:12px;color:var(--fg-2)}
.tbar span{width:46px;display:grid;place-items:center}
.left{background:var(--bg-sidebar);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.lhead{height:60px;display:flex;align-items:center;padding:0 16px;gap:8px}
.wm{font-family:var(--app-display);font-size:24px;line-height:32px;font-weight:800;letter-spacing:-.05em;flex:1}
.pillbtn{height:32px;display:inline-flex;align-items:center;gap:4px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg-raised);font-weight:600;font-size:15px;white-space:nowrap}
.pillbtn.sm{height:28px;font-size:13px;padding:0 10px}
.pillbtn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pillbtn.dark{background:var(--fg-1);border-color:var(--fg-1);color:var(--bg-app)}
.pillbtn.bad{color:var(--bad)}
.pillbtn.acc,.badge,.rb.send,.toast .btns span.p{color:var(--on-accent)!important}.pillbtn.dark{color:var(--bg-app)!important}
.ib{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--fg-2);font-size:16px;flex:none}
.search{margin:0 16px 8px;height:36px;border-radius:999px;background:var(--bg-sunken);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--fg-3);font-size:13px}
.chips{display:flex;gap:8px;padding:4px 16px 8px;flex-wrap:nowrap}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--bg-app);color:var(--fg-2);white-space:nowrap}
.chip.on{background:var(--fg-1);color:var(--bg-app);border-color:var(--fg-1)}
.chip i{font-style:normal;font-weight:600}
.rows{flex:1;min-height:0;overflow:hidden;padding-top:4px}
.row{position:relative;height:72px;margin:0 8px;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:12px}
.row.sel{background:var(--bg-selected)}
.row.sel::before{content:"";position:absolute;left:0;top:24px;width:3px;height:24px;border-radius:999px;background:var(--accent)}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px}
.av.f{background:var(--fg-1);color:var(--bg-app)}
.av.m{width:40px;height:40px;font-size:16px}
.av.s{width:26px;height:26px;font-size:11px}
.rt{flex:1;min-width:0;display:grid;gap:2px}
.l1,.l2{display:flex;gap:8px;align-items:center;min-width:0}
.l1 b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 small{font-size:12px;line-height:16px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.l1 small.u{color:var(--accent)}
.l2 span{flex:1;min-width:0;font-size:13px;line-height:18px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 span em{font-style:normal;color:var(--accent)}
.st{height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.need{background:var(--warn-soft);color:var(--warn)}.st.work{background:var(--accent-soft);color:var(--accent)}.st.done{background:var(--ok-soft);color:var(--ok)}.st.pause{background:var(--bg-sunken);color:var(--fg-2)}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.lfoot{height:64px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px}
.lfoot .t{flex:1;display:grid;font-size:13px;line-height:18px}
.lfoot .t small{font-size:12px;line-height:16px;color:var(--fg-3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok);margin:0 4px 1px 0}
.mid{display:flex;flex-direction:column;min-width:0;min-height:0}
.mhead{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px}
.mhead .t{flex:1;display:grid}
.mhead .t b{font-size:16px;font-weight:600}
.mhead .t small{font-size:12px;line-height:16px;color:var(--accent)}
.col{flex:1;min-height:0;overflow:hidden;padding:12px 24px;display:flex;flex-direction:column;align-items:center}
.col>div{width:100%;max-width:760px;display:flex;flex-direction:column}
.date{align-self:center;font-size:12px;line-height:16px;color:var(--fg-2);background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:16px 0}
.b{position:relative;max-width:min(72%,620px);padding:8px 12px;border-radius:18px;box-shadow:var(--shadow-1);font-size:15px;line-height:22px}
.b.me{align-self:flex-end;background:var(--bubble-me);color:var(--on-bubble-me);border-top-right-radius:6px}
.b.me.cont{border-top-right-radius:18px}
.b.foo{align-self:flex-start;background:var(--bubble-foo);color:var(--on-bubble-foo);border-top-left-radius:6px}
.b.foo.cont{border-top-left-radius:18px}
.meta{float:right;margin:6px 0 -4px 10px;font-size:12px;line-height:16px;color:var(--on-bubble-me-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.b.foo .meta{color:var(--fg-3)}
.meta .rd{color:var(--tick-read-on-me)}
.gap2{height:2px}.gap12{height:12px}.gap4{height:4px}
.sbadge{position:absolute;left:-10px;bottom:-8px;height:24px;min-width:24px;border-radius:999px;background:var(--bg-raised);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;box-shadow:var(--shadow-4)}
.card{align-self:flex-start;width:440px;max-width:100%;background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;font-size:15px;line-height:22px;box-shadow:var(--shadow-1)}
.card.wide{width:600px}
.card.pend{border-top:1.5px solid var(--accent)}
.card .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.card .lbl{margin-left:auto;font-size:12px;line-height:16px;color:var(--fg-3);font-weight:400}
.card .sm{font-size:13px;line-height:18px;color:var(--fg-2)}
.card .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px}
.tk{width:16px;height:16px;border-radius:50%;flex:none;margin-top:1px;display:grid;place-items:center;font-size:10px;font-weight:800}
.tk.d{background:var(--ok);color:var(--bg-app)}
.tk.w{border:2px solid var(--accent);border-right-color:transparent}
.tk.o{border:1.5px solid var(--fg-3)}
.tk.n{background:var(--warn);color:var(--bg-app)}
@media (prefers-reduced-motion:no-preference){.tk.w{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;font-size:12px;line-height:16px}
.tile .ph{height:64px;border-radius:8px;background:linear-gradient(135deg,#5aa6c9,#2f6f8c)}
.tile.rec{border:1.5px solid var(--accent)}
.tile b{font-size:13px}
.tile i{font-style:normal;color:var(--accent);font-weight:600;font-size:11px}
.rcpt{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:13px;line-height:18px}
.rcpt span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.rcpt .tot{font-weight:700;border-top:1px dashed var(--line);padding-top:4px}
.comp{border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:center}
.comp>div{width:100%;max-width:760px;display:flex;gap:8px;align-items:flex-end}
.pill{flex:1;min-height:46px;border-radius:24px;background:var(--bg-raised);border:1px solid var(--line);box-shadow:var(--shadow-4);padding:12px 16px;color:var(--fg-3);font-size:15px;line-height:22px}
.pill.f{color:var(--fg-1)}
.rb{width:36px;height:36px;margin-bottom:5px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:15px}
.rb.plus{border:1px solid var(--line);color:var(--fg-2)}
.rb.mic{background:var(--fg-1);color:var(--bg-app)}
.rb.send{background:var(--accent);color:var(--on-accent)}
.rb.rec{background:var(--bad);color:#fff}
.rb.dis{background:var(--bg-sunken);color:var(--fg-disabled)}
.right{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rhead{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px 0 16px;font-weight:600;font-size:16px}
.rhead span{flex:1}
.rsec{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.rsec h4{margin:0;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.job{display:flex;gap:8px;align-items:flex-start;padding:4px 8px;margin:0 -8px;border-radius:8px;min-height:48px}
.job .t{display:grid;font-size:13px;line-height:18px}
.job .t small{font-size:12px;line-height:16px;color:var(--fg-2)}
.uchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;background:var(--bg-sunken);border:1px solid var(--line);font-size:12px;margin:0 4px 4px 0}
.mem{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;font-size:13px;line-height:18px}
.mem small{font-size:12px;line-height:16px;color:var(--fg-3)}
.meter{display:grid;gap:4px;font-size:13px;line-height:18px}
.meter .r{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.meter .bar{height:4px;border-radius:999px;background:var(--bg-sunken);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.lnk{font-size:13px;color:var(--accent)}
/* small mocks */
.mini{background:var(--bg-sunken);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;font-family:var(--app);font-size:15px;line-height:22px;min-width:0}
.mini .card{width:100%}
.mini .b{max-width:92%}
.ttl{font-size:13px;color:var(--fg-2)}
.cap{font-size:13.5px;color:var(--fg-2)}
.field{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;font-family:var(--mono);font-size:13px;background:var(--bg-sunken)}
.field .eye{margin-left:auto;font-family:var(--app);color:var(--fg-3);font-size:12px}
.scope{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px}
.scope span{flex:1;text-align:center;padding:5px 4px;border-right:1px solid var(--line)}
.scope span:last-child{border-right:0}
.scope span.on{background:var(--fg-1);color:var(--bg-app);font-weight:600}
.qopt{display:flex;justify-content:space-between;align-items:center;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;background:var(--bg-raised)}
.qopt.rec{border:1.5px solid var(--accent);background:var(--accent-soft)}
.qopt.rec::after{content:"Best fit";font-size:11px;font-weight:700;color:var(--accent)}
.chipok{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 10px;width:max-content}
.chipwarn{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px;width:max-content}
.err{background:var(--bad-soft);border-color:transparent}
.err .hd{color:var(--bad)}
.handoff{align-self:center;font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:center}
.handoff::before,.handoff::after{content:"";width:40px;height:1px;background:var(--line-strong)}
.wave{display:flex;gap:2px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.75}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
@media (prefers-reduced-motion:no-preference){.typing i{animation:ty 1.6s infinite}.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}@keyframes ty{0%,60%,100%{transform:scale(1);opacity:.5}30%{transform:scale(1.3);opacity:1}}}
.shim{color:var(--fg-2);font-size:13px}
.tablecard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-raised);font-size:13px}
.tablecard table{font-size:13px}.tablecard th{font-size:12px;letter-spacing:0;text-transform:none}
.code{background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.code .h{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--fg-3);border-bottom:1px solid var(--line)}
.code pre{margin:0;padding:12px;font:13px/20px "Cascadia Mono",Consolas,monospace;white-space:pre-wrap}
.acts{display:flex;gap:2px;color:var(--fg-3);font-size:13px}
.acts span{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.cite{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--bg-sunken);font-size:12px;color:var(--fg-2);vertical-align:middle}

/* screens */
.scr{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.scr .cap2{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.scr .cap2 b{font-size:14px}
.scr .cap2 span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3);white-space:nowrap}
.scr .body{background:var(--bg-sunken);padding:12px;font-family:var(--app);font-size:13px;line-height:18px;display:grid;gap:8px;align-content:start;min-height:200px}
.wf{background:var(--bg-app);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.wf .bar{height:8px;border-radius:4px;background:var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.tog{width:32px;height:16px;border-radius:999px;background:var(--accent);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.tog.off{background:var(--line-strong)}.tog.off::after{left:2px;right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:11px}
.seg span{padding:2px 8px}.seg span.on{background:var(--fg-1);color:var(--bg-app)}
.avpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.avpick span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;max-width:100%}
.avpick span.on{box-shadow:0 0 0 2px var(--bg-app),0 0 0 4px var(--accent)}
.toast{width:364px;max-width:100%;background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-16);padding:12px;display:grid;gap:8px;font-family:var(--app);font-size:13px;line-height:18px}
.toast .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg-2)}
.toast b{font-size:14px}
.toast .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast .btns span{height:32px;border-radius:4px;background:var(--bg-sunken);display:grid;place-items:center;font-size:13px}
.toast .btns span.p{background:var(--accent);color:var(--on-accent)}
.taskbar{display:flex;gap:8px;justify-content:center;align-items:center;background:var(--bg-sunken);border-radius:10px;padding:10px}
.tbx{width:36px;height:36px;border-radius:8px;background:var(--bg-raised);position:relative;display:grid;place-items:center;font-weight:800;font-size:15px}
.tbx .ov{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;border-radius:999px;font-size:10px;display:grid;place-items:center;color:#fff;padding:0 3px}
.menu{width:260px;max-width:100%;background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-16);padding:4px;font-family:var(--app);font-size:13px}
.menu div{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-radius:4px}
.menu div small{color:var(--fg-3);font-size:11px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}



*{box-sizing:border-box}
p{margin:0}
/* ===== Walkthrough page chrome ===== */
html,body{margin:0;height:100%}
body{background:var(--bg-app);color:var(--fg-1);font:14px/1.5 var(--page);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:var(--bg-app);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:8px;padding:8px 16px;min-width:0}
.top h1{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.top h1 span{font-weight:500;color:var(--fg-3);font-size:13px;margin-left:8px}
.tbtn{border:1px solid var(--line);background:var(--bg-raised);border-radius:999px;padding:5px 12px;font-size:12.5px;white-space:nowrap;flex:none}
.tbtn[aria-pressed="true"]{background:var(--fg-1);color:var(--bg-app);border-color:var(--fg-1)}
.tbtn.menu-btn{display:none}
.prog{height:3px;background:var(--bg-sunken)}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);background:var(--bg-sidebar);overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px;padding:8px 8px 40px}
aside .pt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:14px 10px 6px}
aside button.ch{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--fg-1)}
aside button.ch:hover{background:var(--bg-hover)}
aside button.ch[aria-current="true"]{background:var(--accent-soft)}
aside button.ch .n{font:600 11px/1 var(--mono);color:var(--accent)}
aside button.ch .c{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
aside button.ch small{grid-column:2/4;display:block;font-size:11px;color:var(--fg-3);line-height:1.3}
main{min-width:0;padding:14px 16px 32px;display:grid;gap:12px;align-content:start}
.stagewrap{display:flex;justify-content:center;min-width:0}
.stage{position:relative;overflow:hidden;border-radius:10px;box-shadow:var(--shadow-28);border:1px solid var(--line-strong);background:var(--bg-sunken);flex:none}
.frame{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden}
.info{max-width:1100px;width:100%;margin:0 auto;display:grid;gap:10px}
.info .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--fg-2)}
.info .meta b{font-family:var(--mono);color:var(--accent);font-size:12px}
.tag{font:600 11px/1 var(--mono);border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--fg-2);background:var(--bg-sunken)}
.info .capt{font-size:17px;line-height:1.45;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:pretty}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg-raised)}
.pair b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:2px}
.pair p{margin:0;font-size:13.5px;color:var(--fg-1)}
.navrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.navrow .sp{flex:1}
.nb{border:1px solid var(--line-strong);background:var(--bg-raised);border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px}
.nb.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nb:disabled{opacity:.4;cursor:default}
.kbd{font-size:12px;color:var(--fg-3)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);background:var(--bg-raised);padding:0;font-size:0}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.film{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.film .fs{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-raised);text-align:left;padding:0;display:grid}
.film .fs[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.film .fsw{position:relative;overflow:hidden;background:var(--bg-sunken);aspect-ratio:1280/800}
.film .fsw .frame{pointer-events:none}
.film .fs p{margin:0;padding:8px 10px;font-size:12.5px;line-height:1.35}
.film .fs p b{font-family:var(--mono);color:var(--accent);margin-right:4px}
.filmhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filmhd h2{margin:0;font-size:18px;flex:1}
[hidden]{display:none!important}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;top:52px;left:0;bottom:0;width:min(320px,88vw);z-index:40;transform:translateX(-102%);transition:transform .2s;max-height:none;box-shadow:var(--shadow-28)}
  aside.open{transform:none}
  .tbtn.menu-btn{display:inline-block}
  .pair{grid-template-columns:1fr}
  .info .capt{font-size:15.5px}
  .top h1 span{display:none}
}
@media (max-width:560px){ .tbtn .lb{display:none} .tbtn{padding:5px 10px;font-size:14px} .top h1{font-size:15px} .top .in{gap:6px;padding:8px 10px} main{padding:10px 10px 28px} .kbd{display:none} }

/* ===== highlight ring ===== */
.hl{outline:3px solid #F43F5E!important;outline-offset:3px;border-radius:inherit;position:relative;z-index:6;animation:hlp 1.4s ease-out infinite}
@keyframes hlp{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}70%{box-shadow:0 0 0 14px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}

/* ===== app frame overrides ===== */
.win{width:1280px;height:800px;border:0;border-radius:0;box-shadow:none;grid-template-rows:32px auto minmax(0,1fr);grid-template-columns:340px minmax(0,1fr) 340px}
.win.nor{grid-template-columns:340px minmax(0,1fr)}
.win>.left,.win>.mid,.win>.right,.win>.page{grid-row:3;min-height:0}
.tbar{justify-content:space-between}
.tbar .tt{display:flex;align-items:center;padding-left:12px;width:auto;font-size:12px;color:var(--fg-3)}
.tbar .wb{display:flex}
.pillbtn.bad{color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.pillbtn.dis{color:var(--fg-disabled)!important}
.card .pillbtn{color:var(--fg-1)}
.banner{grid-column:1/-1;grid-row:2;height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:13px;border-bottom:1px solid var(--line)}
.banner.warn{background:var(--warn-soft);color:var(--fg-1)}.banner.warn b{color:var(--warn)}
.banner.info{background:var(--accent-soft)}.banner.bad{background:var(--bad-soft)}
.banner .sp{flex:1}
.row.grey{opacity:.55}
.row .wa{font-size:10px;font-weight:700;color:#fff;background:#1F8A55;border-radius:4px;padding:0 4px;margin-left:4px}
.avst{position:relative;width:48px;height:48px;flex:none}
.avst .av{position:absolute;width:32px;height:32px;font-size:13px;border:2px solid var(--bg-sidebar)}
.avst .av:first-child{left:0;top:0}.avst .av:nth-child(2){right:0;bottom:0}
.mhead .pill2{height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.col{justify-content:flex-end;padding:12px 24px 8px}
.col>div{flex:none}
.b.me .react,.b.foo .react{position:absolute;bottom:-12px;height:22px;padding:0 6px;border-radius:999px;background:var(--bg-raised);border:1px solid var(--line);font-size:12px;display:grid;place-items:center;box-shadow:var(--shadow-4)}
.b.me .react{right:10px}.b.foo .react{left:10px}
.b .quote{display:block;border-left:3px solid var(--accent);padding:2px 8px;margin:0 0 6px;font-size:13px;opacity:.85;border-radius:4px;background:rgba(127,127,127,.12)}
.under{align-self:flex-start;font-size:12px;color:var(--fg-3);padding:2px 4px}
.under.r{align-self:flex-end}
.mchip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;width:max-content;max-width:100%;color:var(--accent);background:var(--accent-soft)}
.al-s{align-self:flex-start}.al-e{align-self:flex-end}.al-c{align-self:center}
.card{color:var(--fg-1)}
.card .sm a,.lnk{color:var(--accent)}
.card.warnc{border-color:var(--warn)}.card.warnc>.hd{color:var(--warn)}
.card.okc>.hd{color:var(--ok)}
.card.dim{opacity:.55}
.card .ans{font-size:13px;color:var(--fg-2)}
.card .ans b{color:var(--fg-1)}
.card .imp{font-size:13px;line-height:18px;color:var(--fg-1);background:var(--bg-sunken);border-radius:8px;padding:6px 8px}
.card .cd{font-variant-numeric:tabular-nums}
.card input,.fld{height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg-app);padding:0 10px;font:15px var(--app);color:var(--fg-1);display:flex;align-items:center;gap:8px}
.fld.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fld .ph{color:var(--fg-3)}
.chk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--bg-raised)}
.chk.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg-1)}
.chk.on::before{content:"✓";font-weight:800;color:var(--accent)}
.faces{display:grid;grid-template-columns:repeat(4,64px);gap:12px}
.faces span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700}
.faces span.on{box-shadow:0 0 0 3px var(--bg-raised),0 0 0 5px var(--accent)}
.qr{width:120px;height:120px;border-radius:8px;background:
 conic-gradient(from 90deg at 20% 20%,#000 25%,#fff 0) 0 0/24px 24px;border:8px solid #fff;outline:1px solid var(--line);image-rendering:pixelated}
.steps3{display:grid;gap:4px;font-size:13px}
.ph1{background:linear-gradient(135deg,#5aa6c9,#2f6f8c)}.ph2{background:linear-gradient(135deg,#d39a5b,#9a5d2a)}.ph3{background:linear-gradient(135deg,#7cb38a,#3f7a52)}.ph4{background:linear-gradient(135deg,#c76b6b,#8a2f3f)}.ph5{background:linear-gradient(135deg,#a58bd6,#5b3fa0)}.ph6{background:linear-gradient(135deg,#e1b85c,#b07d1c)}
.tiles .tile .ph{background-size:cover}
.voice{display:flex;gap:10px;align-items:center}
.voice .pl{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.2);font-size:12px}
.voice .spd{font-size:11px;border:1px solid currentColor;border-radius:999px;padding:0 6px;opacity:.7}
.trans{font-size:13px;line-height:18px;opacity:.8;margin-top:4px;display:block}
.undo{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg-1);color:var(--bg-app);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;font-size:13px;box-shadow:var(--shadow-16);z-index:4;white-space:nowrap}
.undo b{color:var(--accent-soft)}
.undo .ub{background:var(--bg-app);color:var(--fg-1);border-radius:999px;padding:4px 12px;font-weight:600}
.findbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px}
.findbar .fld{flex:1;height:32px}
.mark{background:var(--accent-soft);border-radius:4px;box-shadow:0 0 0 2px var(--accent-soft)}
.flash{box-shadow:0 0 0 4px var(--accent-soft)!important}
/* in-app overlays */
.ov{position:absolute;left:0;right:0;top:32px;bottom:0;background:rgba(10,10,16,.42);display:flex;justify-content:center;align-items:center;z-index:8}
.ov.topal{align-items:flex-start;padding-top:72px}
.dlg{background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-28);padding:20px 24px;display:grid;gap:12px;font-size:14px;line-height:20px;color:var(--fg-1)}
.dlg h3{margin:0;font-size:20px;line-height:28px;font-weight:600}
.dlg .bt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg .sub{color:var(--fg-2);font-size:13px}
.dlg .frow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;font-size:13px}
.pal{width:640px;background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-28);overflow:hidden;color:var(--fg-1)}
.pal .in{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-size:15px}
.pal .chips{padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pal .gl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:10px 16px 4px}
.pal .rr{display:flex;gap:10px;align-items:center;padding:6px 16px;min-height:44px;font-size:14px}
.pal .rr.on{background:var(--accent-soft)}
.pal .rr small{display:block;font-size:12px;color:var(--fg-2)}
.pal .rr .r{margin-left:auto;font-size:12px;color:var(--fg-3)}
.pal .ft{border-top:1px solid var(--line);padding:8px 16px;font-size:12px;color:var(--fg-3)}
/* pages */
.page{display:flex;flex-direction:column;min-width:0;background:var(--bg-app)}
.phead{height:60px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}
.phead b{font-size:20px;font-weight:600;flex:1}
.pbody{flex:1;min-height:0;overflow:hidden;display:flex}
.snav{width:240px;flex:none;border-right:1px solid var(--line);padding:12px;display:grid;gap:4px;align-content:start}
.snav span{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:8px;font-size:14px}
.snav span.on{background:var(--accent-soft);font-weight:600}
.snav span i{font-style:normal;width:20px;text-align:center;color:var(--fg-2)}
.snav span.on i{color:var(--accent)}
.pcont{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.pcont>div{width:100%;max-width:760px;display:grid;gap:10px;align-content:start}
.pcont h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
.pcont .intro{color:var(--fg-2);font-size:14px}
.slbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-top:6px}
.sbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-raised)}
.srow{min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;min-width:0;display:grid}
.srow .t small{font-size:12px;line-height:16px;color:var(--fg-2)}
.srow .v{color:var(--fg-2);font-size:13px;white-space:nowrap}
.seg3{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;font-size:12.5px;flex:none}
.seg3 span{padding:4px 12px;border-right:1px solid var(--line)}.seg3 span:last-child{border-right:0}
.seg3 span.on{background:var(--fg-1);color:var(--bg-app);font-weight:600}
.seg3 span.lk{color:var(--fg-disabled)}
.tipb{position:absolute;background:var(--fg-1);color:var(--bg-app);font-size:12px;border-radius:6px;padding:5px 9px;white-space:nowrap;box-shadow:var(--shadow-16);z-index:7}
.memr{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px;min-height:52px}
.memr:last-child{border-bottom:0}
.memr .t{flex:1;display:grid}.memr .t small{font-size:12px;color:var(--fg-3)}
.memr .a{font-size:12.5px;color:var(--accent);white-space:nowrap}
.src2{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600}
.src2.said{background:var(--ok-soft);color:var(--ok)}.src2.guess{background:var(--warn-soft);color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tilep{border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px;background:var(--bg-raised)}
.tilep b{font-size:20px}.tilep small{color:var(--fg-2);font-size:12px}
.hbar{height:8px;border-radius:999px;background:var(--accent)}
.rtlist{width:300px;flex:none;border-right:1px solid var(--line);padding:12px;display:grid;gap:6px;align-content:start}
.rti{border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:14px;border:1px solid var(--line)}
.rti.on{background:var(--accent-soft);border-color:var(--accent)}
.rti small{font-size:12px;color:var(--fg-2)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--fg-2)}
.hl-row{background:var(--accent-soft)}
/* live view */
.livebox{padding:12px 16px;display:grid;gap:8px}
.livepic{height:193px;border-radius:12px;border:1px solid var(--line);background:var(--bg-sunken);overflow:hidden;position:relative}
.livep{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--bad);text-transform:uppercase}
.livep::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.livep.w{color:var(--warn)}.livep.o{color:var(--ok)}.livep.g{color:var(--fg-3)}
.rbar{height:4px;border-radius:999px;background:var(--bg-sunken);position:relative}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
/* mini web page */
.web{background:#fff;color:#1d2330;font:13px/1.4 system-ui,sans-serif;height:100%;display:flex;flex-direction:column}
.web .wh{height:40px;background:#0c3a6b;color:#fff;display:flex;align-items:center;padding:0 14px;font-weight:700;gap:10px}
.web .wb{flex:1;padding:16px 20px;display:grid;gap:10px;align-content:start}
.web .wf{height:30px;border:1px solid #c9ced8;border-radius:6px;display:flex;align-items:center;padding:0 8px;color:#6b7280;font-size:12px;background:#fff}
.web .wf.blur{color:transparent;text-shadow:0 0 6px rgba(0,0,0,.6);background:#eef0f4}
.web .wbtn{height:32px;border-radius:6px;background:#e5531a;color:#fff;display:grid;place-items:center;font-weight:700;width:180px}
.web .bar{height:10px;border-radius:5px;background:#e3e6ec}
.web .lab{font-size:11px;color:#6b7280}
/* ===== Windows desktop ===== */
.desk{position:absolute;inset:0;background:radial-gradient(120% 90% at 70% 110%,#1d4fd8 0%,#3b82f6 30%,#93c5fd 55%,#dbeafe 80%);font-family:var(--app);overflow:hidden}
:root[data-theme="dark"] .desk{background:radial-gradient(120% 90% at 70% 110%,#1e3a8a 0%,#1e40af 30%,#0f172a 75%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .desk{background:radial-gradient(120% 90% at 70% 110%,#1e3a8a 0%,#1e40af 30%,#0f172a 75%)}}
.dicons{position:absolute;left:16px;top:16px;display:grid;gap:18px;color:#fff;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:center;width:80px}
.dicons span{display:grid;justify-items:center;gap:4px}
.dicons i{font-style:normal;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.18)}
.dicons i.foo{background:#0B0B10;color:#fff;font-weight:800;font-size:22px;font-family:var(--app-display)}
.dicons span.sel i{outline:2px solid #fff}
.tb{position:absolute;left:0;right:0;bottom:0;height:48px;background:color-mix(in srgb,var(--bg-sidebar) 92%,transparent);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-1)}
.tb .ti{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;font-size:18px;position:relative}
.tb .ti.f{font-family:var(--app-display);font-weight:800;font-size:20px}
.tb .ti.f::before{content:"";position:absolute;inset:6px;border-radius:6px;background:var(--fg-1);z-index:0}
.tb .ti.f b{position:relative;z-index:1;color:var(--bg-app)}

/* ===== living face · Direction A (copied from foo-face.html) ===== */
:root{--on-helper:#FFFFFF}
svg.face{overflow:visible;display:block;flex:none;forced-color-adjust:none}
.face .disc{fill:var(--fd)}
.face .ffill{fill:var(--ff)}
.face .fstr{fill:none;stroke:var(--ff);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.face .lid{fill:var(--fd)}
.face .ring{fill:none}
.face .rg-work{stroke:var(--accent);stroke-linecap:round}
.face .rg-stuck{stroke:var(--warn);stroke-linecap:round}
.face .rg-need{stroke:var(--warn)}
.face .rg-wait{stroke:var(--warn)}
.face .rg-ok{stroke:var(--ok)}
.face .rg-bad{stroke:var(--bad)}
.face .rg-listen{stroke:var(--accent);opacity:.55}
.face .rg-think{stroke:var(--accent);stroke-linecap:round}
.face .rg-off{stroke:var(--fg-3)}

.face.off .ffill{fill:none;stroke:var(--fg-3);stroke-width:3}
.face.off .fstr{stroke:var(--fg-3)}
.face .emobg{fill:var(--bg-raised);stroke:var(--line-strong);stroke-width:1.5}
.face .spark{fill:var(--accent)}
.face .spark.k2{fill:var(--ok)}
.face .zz{fill:var(--fg-2);font:700 22px var(--app)}
.face.fsm .zz,.face.fsm .spark{display:none}
.face .cust{font-family:"Segoe UI Emoji","Noto Color Emoji",sans-serif}
.face.dim .disc,.face.dim .cust{opacity:.55}
.face.gray .cust{filter:grayscale(1);opacity:.6}
.face g,.face circle,.face rect,.face path,.face text,.face ellipse,.face polygon{transform-box:view-box}
.face .blink{animation:fblink var(--bd,5600ms) linear infinite;animation-delay:var(--bdel,0ms)}
.face .blink-slow{animation:fblink 8400ms linear infinite;animation-delay:var(--bdel,0ms)}
.face .spin{animation:fspin 1600ms linear infinite;transform-origin:50px 50px}
.face .spin-slow{animation:fspin 3200ms linear infinite;transform-origin:50px 50px}
.face .drift{animation:fdrift 2400ms ease-in-out infinite alternate}
.face .lookaround{animation:flook 4000ms ease-in-out infinite}
.face .lvl{animation:flvl 280ms ease-in-out infinite alternate;transform-box:fill-box!important;transform-origin:center}
.face .zzz{animation:fzz 4000ms ease-in-out infinite}
/* one-time moods play once on arrival, then hold the pose */
.face .tr{animation-iteration-count:1!important}
.face .wake{animation:fwake 3000ms var(--ease-standard,cubic-bezier(.33,1,.68,1)) both}
.face .pop{animation:fpop 2400ms var(--ease-standard,cubic-bezier(.33,1,.68,1)) both;transform-origin:50px 50px}
.face .nod{animation:fnod 2400ms var(--ease-standard,cubic-bezier(.33,1,.68,1)) both}
.face .okring{animation:fokring 3000ms linear both}
.face .badflash{animation:fokring 3000ms linear both}
.face .sparkle{animation:fspark 3000ms var(--ease-standard,cubic-bezier(.33,1,.68,1)) both}
.face .emopop{animation:femopop 2400ms var(--ease-standard,cubic-bezier(.33,1,.68,1)) both;transform-origin:84px 84px}
.face .fadein{animation:ffadein 2400ms linear both}
.face.still .tr{animation:none!important}
@keyframes fblink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.08)}}
@keyframes fspin{to{transform:rotate(360deg)}}
@keyframes fdrift{0%{transform:translateX(-5px)}100%{transform:translateX(5px)}}
@keyframes flook{0%,20%{transform:translateX(0)}35%,52%{transform:translateX(-7px)}68%,86%{transform:translateX(7px)}100%{transform:translateX(0)}}
@keyframes flvl{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
@keyframes fzz{0%{opacity:0;transform:translate(0,4px)}30%,60%{opacity:1}100%{opacity:0;transform:translate(5px,-8px)}}
@keyframes fwake{0%{transform:scaleY(.08)}20%,100%{transform:scaleY(1)}}
@keyframes fpop{0%{transform:scale(1)}6%{transform:scale(1.1)}17%,100%{transform:scale(1)}}
@keyframes fnod{0%{transform:translateY(0)}8%{transform:translateY(-5px)}17%,100%{transform:translateY(0)}}
@keyframes fokring{0%{opacity:0}5%{opacity:1}60%{opacity:1}80%,100%{opacity:0}}
@keyframes fspark{0%{opacity:0;transform:translate(0,0) scale(.3)}8%{opacity:1}40%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes femopop{0%{transform:scale(0)}12%{transform:scale(1.15)}18%{transform:scale(1)}75%{transform:scale(1);opacity:1}90%,100%{transform:scale(1);opacity:0}}
@keyframes ffadein{0%{opacity:0}4%,100%{opacity:1}}
/* reduced motion and filmstrip thumbnails: static poses (F15.9.5). Speaking bars still move. */
@media (prefers-reduced-motion: reduce){
  .face *:not(.lvl){animation:none!important}
  .face .spark{opacity:1;transform:translate(var(--dx),var(--dy))}
  .face .okring,.face .badflash{opacity:1}
  .xfade .mk{display:none}
}
.film .face *{animation:none!important}
.film .face .spark{opacity:1;transform:translate(var(--dx),var(--dy))}
.film .face .okring{opacity:1}
.film .face.still .okring{opacity:1}
/* forced colours */
@media (forced-colors: active){
  .face{--fd:Canvas!important;--ff:CanvasText!important}
  .face .disc{stroke:CanvasText;stroke-width:4}
  .face .ring{stroke:Highlight!important}

}

<script>
/* ================= living face · Direction A "Two eyes" (F15.9) ================= */
/* Geometry, rings, poses and keyframes copied from scratchpad/face/foo-face.html (direction A). */
const FACE_CHATS={foo:null,trips:'#B54A2F',money:'#17804D',home:'#6B5BD6',news:'#2F6F95'};
const isFace=k=>Object.prototype.hasOwnProperty.call(FACE_CHATS,k);
const FONE=['wake','seen','happy','party','thumb','heart','sorry','stopped'];
let FUID=0;
const frnd=(a,b)=>Math.round(a+Math.random()*(b-a));
function fRingFor(m,custom){
  const map={work:'work',stuck:'stuck',need:'need',wait:'wait',happy:'ok',party:'ok'};
  if(custom)Object.assign(map,{listen:'listen',think:'think',sorry:'bad',offline:'off'});
  return map[m]||'';
}
function fRing(kind,size){
  if(!kind)return '';
  const sw=(size<=48?2:3)*100/size,gap=(size<=26?1.5:2)*100/size,r=50+gap+sw/2;
  const c=(cls,extra)=>`<circle class="ring rg-${kind} ${cls||''}" cx="50" cy="50" r="${r.toFixed(2)}" stroke-width="${sw.toFixed(2)}" pathLength="100" ${extra||''}/>`;
  switch(kind){
    case 'work':return `<g class="spin">${c('','stroke-dasharray="28 72"')}</g>`;
    case 'think':return `<g class="spin-slow">${c('','stroke-dasharray="1 7"')}</g>`;
    case 'stuck':return c('','stroke-dasharray="28 72" transform="rotate(-90 50 50)"');
    case 'need':return `<g class="nod tr">${c()}</g>`;
    case 'wait':return c('','stroke-dasharray="5 3.33"');
    case 'ok':return c('okring tr');
    case 'bad':return c('badflash tr');
    case 'listen':return c();
    case 'off':return c('','stroke-dasharray="3 5"');
  }
  return '';
}
function fSparks(){
  const pts=[[-40,-30,1],[40,-34,2],[46,22,1],[-46,18,2]];
  return pts.map(([dx,dy,k])=>{const a=Math.atan2(dy,dx),x=50+52*Math.cos(a),y=50+52*Math.sin(a);return `<circle class="spark sparkle tr ${k===2?'k2':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" style="--dx:${(dx*.35).toFixed(1)}px;--dy:${(dy*.35).toFixed(1)}px"/>`}).join('');
}
const fEmo=e=>`<g class="emopop tr"><circle class="emobg" cx="84" cy="84" r="18"/><text x="84" y="85" text-anchor="middle" dominant-baseline="central" font-size="20" class="cust">${e}</text></g>`;
const fZz=()=>`<text class="zz zzz" x="80" y="16">z</text>`;
const fR=(cx,cy,w,h)=>`<rect class="ffill" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${w/2}"/>`;
const fUP=(cx,cy)=>`<path class="fstr" d="M${cx-8} ${cy+4}Q${cx} ${cy-9} ${cx+8} ${cy+4}"/>`;
const fDN=(cx,cy)=>`<path class="fstr" d="M${cx-8} ${cy-2}Q${cx} ${cy+7} ${cx+8} ${cy-2}"/>`;
const fFL=(cx,cy,l)=>`<path class="fstr" d="M${cx-(l||7)} ${cy}H${cx+(l||7)}"/>`;
function featA(m){
  const L=36,Rr=64,Y=48;let pose='',mid='',bl='blink',eyes=fR(L,Y,12,24)+fR(Rr,Y,12,24),extra='';
  switch(m){
    case 'wake':bl='wake tr';break;
    case 'seen':eyes=fR(L,Y,13,27)+fR(Rr,Y,13,27);mid='pop tr';bl='';break;
    case 'listen':pose='translate(0,7)';bl='blink-slow';break;
    case 'think':pose='translate(0,-8)';mid='drift';eyes=fR(L,Y,12,20)+fR(Rr,Y,12,20);bl='blink-slow';break;
    case 'work':pose='translate(0,2)';eyes=fR(L,Y,12,18)+fR(Rr,Y,12,18);break;
    case 'stuck':mid='lookaround';eyes=fR(L,Y,12,20)+fR(Rr,Y,12,20);bl='';break;
    case 'need':eyes=fR(L,Y,13,26)+fR(Rr,Y,13,26);mid='nod tr';break;
    case 'wait':pose='translate(0,3)';eyes=fR(L,Y,12,22)+fR(Rr,Y,12,22)+`<rect class="lid" x="${L-9}" y="${Y-14}" width="18" height="12"/><rect class="lid" x="${Rr-9}" y="${Y-14}" width="18" height="12"/>`;bl='blink-slow';break;
    case 'happy':eyes=fUP(L,Y)+fUP(Rr,Y);bl='';break;
    case 'party':eyes=fUP(L,Y-2)+fUP(Rr,Y-2);bl='';extra=fSparks();break;
    case 'thumb':eyes=fUP(L,Y)+fR(Rr,Y,12,24);bl='';extra=fEmo('👍');break;
    case 'heart':eyes=fUP(L,Y)+fUP(Rr,Y);bl='';extra=fEmo('❤️');break;
    case 'speak':pose='translate(0,-5)';eyes=fR(L,Y,12,20)+fR(Rr,Y,12,20);extra=[44,50,56].map((x,i)=>`<rect class="ffill lvl" x="${x-2}" y="66" width="4" height="12" rx="2" style="animation-delay:-${i*110}ms"/>`).join('');break;
    case 'sorry':pose='translate(0,5)';eyes=fR(L,Y,12,18)+fR(Rr,Y,12,18)+`<polygon class="lid" points="${L-9},${Y-11} ${L+9},${Y-11} ${L-9},${Y+1}"/><polygon class="lid" points="${Rr-9},${Y-11} ${Rr+9},${Y-11} ${Rr+9},${Y+1}"/>`;bl='';break;
    case 'stopped':eyes=fFL(L,Y+2)+fFL(Rr,Y+2);bl='fadein tr';break;
    case 'offline':eyes=fR(L,Y,10,20)+fR(Rr,Y,10,20);bl='';break;
    case 'asleep':eyes=fDN(L,Y+4)+fDN(Rr,Y+4);bl='';extra=fZz();break;
  }
  return {pose,mid,bl,eyes,extra,oy:Y};
}
/* one face as inline SVG. k = chat id, o.custom = picture/emoji face, o.still = no one-shot replay */
function fface(k,mood,size,o){
  o=o||{};FUID++;
  const fill=o.fill!==undefined?o.fill:FACE_CHATS[k];
  const custom=o.custom||null;
  const cls=['face','m-'+mood];if(size<40)cls.push('fsm');if(o.still)cls.push('still');if(o.cls)cls.push(o.cls);
  const vars=fill?`--fd:${fill};--ff:var(--on-helper,#fff);`:'--fd:var(--fg-1);--ff:var(--bg-app);';
  let body='',extra='';
  let rk=fRingFor(mood,!!custom);
  if(o.still&&(mood==='happy'||mood==='party'))rk='';
  if(custom){
    if(mood==='offline')cls.push('gray');if(mood==='asleep')cls.push('dim');
    const bg=fill?'':`style="fill:var(--bg-sunken)"`;

/* ---------- moods from the real state of a frame (F15.9.3, priority order) ---------- */
function fHour(t){const m=/(\d+):(\d+)\s*(AM|PM)/.exec(t||'');if(!m)return 12;let h=+m[1]%12;if(m[3]==='PM')h+=12;return h}
const fOpenCard=h=>/class="card pend/.test(h)&&!/Approved|Opened in|Replaced/.test(h);
function moodsOf(s,st,prevMo){
  const a=s.a,d=s.d,ov=st.fm||{},out={},still={};
  const pm=(prevMo&&prevMo.m)||{};
  const appOn=s.view==='app'||!!d.app;
  const off=!!((a.banner&&/offline|isn.t answering/i.test(a.banner.text))||(a.comp&&a.comp.m==='off'));
  const h=fHour(d.time),quiet=h>=22||h<7;
  const ids=new Set(['foo',...a.rows.map(r=>r.id)].filter(isFace));
  const added=[].concat(st.add||[],st.addTo?Object.values(st.addTo).flat():[]).map(x=>x&&x.h||'').join('');
  for(const k of ids){
    const r=a.rows.find(x=>x.id===k)||{};
    const sel=a.sel===k&&!a.page&&appOn;
    const hs=sel?((a.hdr||{}).status||''):'';
    const th=a.th[k]||[];
    const open=sel&&th.some(x=>fOpenCard(x.h));
    const typing=sel&&th.some(x=>/data-hl="typing"/.test(x.h));
    let m='rest';
    if(off)m='offline';
    else if(/stuck/i.test(hs))m='stuck';
    else if(r.st==='need'||/^Needs you/i.test(hs)||open){
      const fresh=!(pm[k]==='need'||pm[k]==='wait')||(sel&&prevMo&&prevMo.sel!==k)||(open&&/class="card pend/.test(added));
      m=sel&&!fresh?'wait':'need';
    }
    else if(r.st==='work'||/^Working|paying/i.test(hs))m='work';
    else if(typing)m='think';
    else if(sel&&a.comp&&a.comp.m==='stop')m='work';
    else if(sel&&a.comp&&(a.comp.m==='type'||a.comp.m==='rec'))m='listen';
    else if(quiet)m='asleep';
    if(ov[k])m=ov[k];
    out[k]=m;
    still[k]=pm[k]===m;
  }
  for(const k in ov)if(!(k in out)){out[k]=ov[k];still[k]=pm[k]===ov[k]}
  /* tray: one state for the whole app, from the same moods */
  const v=Object.values(out),has=x=>v.includes(x);
  const toastM=d.toast?(st.toastMood||d.toast.mood||out[d.toast.av||'foo']||'rest'):null;
  let tray='rest';
  if(has('offline'))tray='offline';
  else if(has('need')||has('wait')||has('stuck')||toastM==='need')tray='need';
  else if(has('work'))tray='work';
  else if(has('happy')||has('party')||(d.tb&&d.tb.badge==='done'))tray='done';
  else if(v.length&&v.every(x=>x==='asleep'))tray='quiet';
  return {m:out,still,tray,toast:toastM,sel:a.sel};
}
function fillFaces(html,mo){

    const mood=m||mo.m[k]||'rest';
    const g=x&&/grp/.test(x);
    const gm=g?(['work','need','wait','stuck'].includes(mood)?(mood==='wait'?'need':mood):'rest'):mood;
    return fface(k,gm,+sz,{still:g||(!m&&mo.still[k]),cls:x||''});
  });
}

const clone=o=>JSON.parse(JSON.stringify(o));
const MERGE=['hdr','det','comp','live'];

function apply(s,st,where){
  if(st.view)s.view=st.view;
  if(st.a)for(const k in st.a){const v=st.a[k];if(MERGE.includes(k)&&v&&s.a[k])s.a[k]=Object.assign({},s.a[k],v);else s.a[k]=clone(v===undefined?null:v)}
  if(st.d)for(const k in st.d)s.d[k]=clone(st.d[k]===undefined?null:st.d[k]);
  if(st.rows)s.a.rows=clone(st.rows);
  if(st.rowp)for(const k in st.rowp){const i=s.a.rows.findIndex(r=>r.id===k),p=st.rowp[k];
    if(p===null){if(i>=0)s.a.rows.splice(i,1)}else if(i<0){s.a.rows.unshift(Object.assign({id:k},clone(p)))}else{const r=s.a.rows[i];for(const q in p){if(p[q]===null)delete r[q];else r[q]=clone(p[q])}}}
  if(st.order)s.a.rows.sort((x,y)=>{const a=st.order.indexOf(x.id),b=st.order.indexOf(y.id);return (a<0?99:a)-(b<0?99:b)});
  if(st.th)for(const k in st.th)s.a.th[k]=clone(st.th[k]);
  if(st.clear)s.a.th[s.a.sel]=[];
  if(st.add){const k=st.to||s.a.sel;s.a.th[k]=(s.a.th[k]||[]).concat(clone(st.add))}
  if(st.addTo)for(const k in st.addTo)s.a.th[k]=(s.a.th[k]||[]).concat(clone(st.addTo[k]));
  if(st.upd)for(const id in st.upd){let hit=false;for(const k in s.a.th){const arr=s.a.th[k];for(let i=arr.length-1;i>=0;i--)if(arr[i].id===id){hit=true;if(st.upd[id]===null)arr.splice(i,1);else arr[i]=Object.assign(clone(st.upd[id]),{id})}}if(!hit)window.__miss.push(where+' upd '+id)}
}

CH.push({id:'ai',part:'Day 0 · Thu 15 Oct, evening',t:'Find your AI',j:'J2',r:'R3 · R4',base:firstRun,
start:{a:{hdr:{status:'Setting up',pill:'Step 1 of 4 · foo finds your AI'}},th:{foo:[M.date('Today, Thu 15 Oct'),M.card('w',card({body:`<div class="ans">Hi, I'm foo. → <b>Let's go</b></div>`}))]}},
steps:[
{c:`foo looks for an AI you already have, in a fixed order: Claude, ChatGPT, Gemini, saved keys, then a free AI on this PC.`,s:`A card with five rows, each spinning "Looking…". A pill in the header says "Step 1 of 4".`,f:`Checks your PC for sign-ins and saved keys. It doesn't install anything.`,hl:'finder',add:[M.card('finder',finder([SPIN,SPIN,SPIN,SPIN,SPIN]))]},
{c:`For each one it finds, foo asks one tiny real question, with 20 seconds to answer.`,s:`Claude and ChatGPT say "Testing…". Gemini and a local AI aren't here. "OpenAI key" offers a secret box.`,f:`Sends "Reply with the word ready" to each AI it found.`,hl:'finder',upd:{finder:M.card(0,finder([TEST,TEST,NF,B('Add in secret box'),NF]))}},
{c:`Both answered. Until one AI really works, the message box stays locked.`,s:`Two green "✓ works". The message box reads "Connect your AI first, then we can talk."`,f:`Keeps chat locked until a live test passes, so you never talk to a dead end.`,hl:'comp',upd:{finder:M.card(0,finder([OK,OK,NF,B('Add in secret box'),NF]))}},
{c:`foo picks the first one that works and tells you why, in one line.`,s:`"I'll use Claude…" with Use Claude / Pick another, and a note that this uses your Claude plan.`,f:`Picks Claude because it's first in the order and good at bookings. Waits for your tap.`,hl:'useclaude',add:[M.foo(`I'll use <b>Claude</b>. It works and it's the best fit for jobs like bookings. You can change this any time in Settings.`,'7:42 PM',{id:'pick'}),M.card('pickc',card({body:`<div class="sm">This uses your Claude plan. If you hit its limit, I'll tell you and wait.</div>`,btns:B('Use Claude','acc','useclaude')+B('Pick another')}),4)]},
{c:`You tap Use Claude. The card shrinks to one line and chat unlocks.`,s:`"✓ Using Claude (your AI)". Details → Using shows "Claude (your AI)". The pill moves to "Step 2 of 4".`,f:`Saves Claude as your AI. Your words go only to Claude, nowhere else.`,hl:'using',upd:{finder:M.card(0,card({cls:'okc',hd:'✓ Using Claude (your AI)'})),pick:null,pickc:null},a:{comp:{m:'rest'},det:{using:['Claude (your AI)']},hdr:{pill:'Step 2 of 4 · Name it and pick a face'},ai:'Claude ready',aiTone:null}},
{c:`What if foo finds no AI at all? It asks which one you use, or whether you have a key.`,s:`"I couldn't find an AI on this PC yet. Which one do you use?" with sign-in choices and "I have a key".`,f:`Links to the maker's own sign-in page. It never installs anything silently.`,hl:'havekey',th:{foo:[M.date('Today, Thu 15 Oct'),M.card('f2',choice(`I couldn't find an AI on this PC yet. Which one do you use?`,[['ChatGPT · sign in with your account',1],['Claude · sign in with your account'],['Gemini · sign in'],['I have a key',0,'havekey']],{other:false}))]},a:{comp:{m:'lock'},det:{using:[]},hdr:{pill:'Step 1 of 4 · foo finds your AI'},ai:'Setting up',aiTone:'fg-3'}},
{c:`You pick "I have a key" → OpenAI. foo shows a Secret box, never a chat bubble, for the key.`,s:`"To use your own AI I need your OpenAI key. Paste it in the box below, not in the chat." A masked box with Save securely.`,f:`The key goes straight into Windows' own safe store. foo's AI only ever sees the name "OpenAI key".`,hl:'savesecure',add:[M.foo(`To use your own AI I need your OpenAI key. Paste it in the box below, not in the chat.`,'7:43 PM'),M.card('sbox',card({hd:'🔑 OpenAI key',lbl:'Secret',body:`<div class="field">sk-••••••••••••3f9a<span class="eye">Show</span></div>`,btns:B('Save securely','dark','savesecure')+B('Not now'),foot:`<span style="color:var(--ok)">● Stored on this PC. foo's AI never sees it.</span>`}),4)]},
{c:`What if you paste the key into the message box by mistake? foo stops it before it's sent.`,s:`A warning card above the message box: "That looks like a key". The send button is greyed out.`,f:`Spots the key pattern on your PC before anything leaves. Offers to move it to the Secret box.`,hl:'movesecret',a:{comp:{m:'paste',text:'sk-proj-••••••••••••',above:card({cls:'warnc',st:'width:100%',hd:'⚠ That looks like a key',body:`<div class="sm">Save it in the secret box instead of sending it?</div>`,btns:B('Move to secret box','dark','movesecret')+B('Remove it')})}}},
{c:`Saved. With a key, foo shows cost and stops at your monthly cap, ₹1,000 to start. (Vikas had Claude, so the rest uses Claude.)`,s:`"✓ Saved securely. foo's AI never sees it." and "OpenAI key ✓ works", with a line about the ₹1,000 cap.`,f:`Tests the key with one real question, then turns on the AI spend meter.`,hl:'changecap',a:{comp:{m:'rest'}},upd:{sbox:M.card(0,card({cls:'okc',hd:'✓ Saved securely. foo’s AI never sees it.',body:`<div class="setrow" style="font-size:14px"><span>OpenAI key · saved Thu 15 Oct</span>${OK}</div><div class="sm">This uses your OpenAI key, so each job costs a little. I'll show the cost and stop at your monthly cap (₹1,000 to start).</div>`,btns:B('Change cap','','changecap')+B('Replace')}))}}

{c:`"Pick a face." foo's living face comes first and is already picked. You can still choose another face or your own picture.`,s:`Four round faces: foo's two eyes on its black disc, marked "Living face (default)", then ✿, ◐ and ★. Buttons for new faces or your own picture.`,f:`If your AI can make pictures, the other three would be fresh ones; otherwise these presets. A picture or emoji you choose is never changed.`,hl:'face1',add:[M.card('faces',FACES(0))]},
{c:`You keep the living face. The header and the chat row show it straight away, blinking now and then.`,s:`A ring around the chosen face. The left row is no longer grey, and the same two eyes sit in the header.`,f:`Uses the face in the chat list, header, notifications and tray. The app icon keeps the "f".`,hl:'row-foo',upd:{faces:M.card(0,FACES(1))},rowp:{foo:{grey:null,time:'7:44 PM',prev:'Pick a face.'}}},
{c:`foo shows you once how to read its face.`,s:`"My face shows what I'm really doing." Four small faces: a turning blue ring = working · an amber ring = needs you · smiling eyes = done · closed eyes = quiet hours.`,f:`The face only changes when something really happens: a job, a card, the internet or the clock. With a picture face, the same news shows as a thin ring around it.`,hl:'facelegend',add:[M.foo(`My face shows what I'm really doing. Nothing more.`,'7:44 PM'),M.card('legend',card({hl:'facelegend',body:`<div class="mlegend"><span>${FP('foo',40,'work')}Working on something</span><span>${FP('foo',40,'need')}Needs you</span><span>${FP('foo',40,'happy')}Done, with proof</span><span>${FP('foo',40,'asleep')}Quiet hours</span></div>`}),4)]},
{c:`"How should I talk to you?" You choose a vibe.`,s:`A choice card: Calm, a bit funny (Best fit) · Straight to the point · Warm and chatty · Something else…`,f:`Tone only. It never changes what foo is allowed to do.`,hl:'vibe0',add:[M.card('vibe',choice('How should I talk to you?',[['Calm, a bit funny',1],['Straight to the point'],['Warm and chatty']],{hlp:'vibe'}))]},

]});

steps:[
{c:`Eight short questions, one card each. First: what should foo call you?`,s:`"What should I call you?" with a "Vikas" chip from your Windows account, Something else… and Skip.`,f:`Offers your Windows name as a chip. Your AI doesn't see it unless you pick it.`,hl:'vikas',add:[M.card('A',IV('What should I call you?',`<span class="pillbtn sm"${hl('vikas')}>Vikas</span>`+B('Something else…'),'cA',{lbl:'1 of 8'}))]},
{c:`"Hi Vikas." Next: may foo peek at which apps you have? Not your files.`,s:`"Can I peek at which apps you have installed? Not your files." Yes, have a look / No thanks.`,f:`If yes, reads only the list of installed apps, to pre-tick the next card.`,hl:'peek',upd:{A:M.card(0,ans('What should I call you?','Vikas'))},add:[M.foo('Hi Vikas.','7:46 PM'),M.card('B',IV('Can I peek at which apps you have installed? Not your files.',B('Yes, have a look','','peek')+B('No thanks'),'',{lbl:'2 of 8'}))]},
{c:`Which apps do you use most? foo pre-ticked what it saw. You tap Done.`,s:`Chips: WhatsApp ✓ · Gmail + Calendar ✓ · Outlook · X ✓ · Instagram · None of these.`,f:`Notes X for drafting later. Posting is never done by foo.`,hl:'appsdone',upd:{B:M.card(0,ans('Can I peek at which apps you have installed?','Yes, have a look'))},add:[M.card('C',IV('Which apps do you use most?',chips([['WhatsApp',1],['Gmail + Calendar',1],['Outlook'],['X',1],['Instagram'],['None of these']])+B('Done','acc','appsdone'),'',{lbl:'3 of 8'}))]},

{c:`Google's own page opens in your browser. You check what foo asks for and allow it.`,s:`Read email · create drafts · send only after you approve in foo · see and add calendar events.`,f:`Waits. foo never sees your Google password.`,hl:'gconsent',view:'desk',d:{app:true,wins:[{k:'browser',x:220,y:70,w:820,h:600,tab:'Sign in – Google Accounts',url:'accounts.google.com',site:'google',hlb:'gconsent'}],tbx:['🌐']}},
{c:`Back in foo: connected. Details → Using now shows Gmail and Calendar.`,s:`"✓ Connected as v••••@gmail.com".`,f:`Saves the connection in Windows' safe store. Starts reading only what it needs.`,hl:'using',view:'app',d:{wins:[],tbx:[]},upd:{D:M.card(0,card({cls:'okc',hd:'✓ Connected as v••••@gmail.com'}))},a:{det:{using:['Claude (your AI)','Gmail','Calendar']}}},
{c:`WhatsApp is optional. The card is honest that the link can drop now and then.`,s:`"Link WhatsApp. I can read your chats to remind you of things, and draft messages for you to send. I never send a WhatsApp message without your tap."`,f:`Nothing until you tap Show QR code.`,hl:'showqr',add:[M.card('E',card({hd:'💬 Link WhatsApp',lbl:'5 of 8',body:`<div class="sm">I can read your chats to remind you of things, and draft messages for you to send. I never send a WhatsApp message without your tap.</div>`,btns:B('Show QR code','dark','showqr')+B('Not now'),foot:'WhatsApp may unlink foo now and then. If that happens I’ll ask you to scan again.'}))]},

steps:[
{c:`Helpers are extra contacts with a job. You start one from "+ New helper".`,s:`The "+ New helper" pill at the top of your chat list (or Ctrl+N).`,f:`Opens a short form. Up to 8 helpers.`,hl:'newhelper'},
{c:`Templates fill everything at once. You tap Trips.`,s:`A 720-wide form: Trips · Money · Home · Family · Custom, then name, job, good result, face, colour and apps.`,f:`Nothing is created until you tap Create.`,hl:'tpl-Trips',a:{ov:HELPERDLG()}},
{c:`Payments are off by default. You tick it, and foo says exactly what that means.`,s:`"Trips can ask you to approve payments. It can never pay without your tap."`,f:`Gives Trips the right to show Payment cards, never to pay alone.`,hl:'paytick',a:{ov:HELPERDLG({t:'Trips',pay:1})}},
{c:`You tap Create Trips.`,s:`The same form, ready.`,f:`Creates the helper with its own chat, face, colour and notes.`,hl:'create'},
{c:`Trips appears in the list and texts first, with one useful thing.`,s:`"Hi, I'm Trips. I'll look after your travel. I already see your Goa trip on Sat 12–Mon 14 Dec. Anything to sort for it?"`,f:`Shares "What I know about you" with foo, but keeps its own notes.`,hl:'row-trips',a:{ov:null,sel:'trips',hdr:{status:'Helper · plans and books your travel'}},rowp:{trips:R('trips','Trips','8:11 PM',`Hi, I'm Trips. I'll look after your travel…`,{u:1})},th:{trips:[M.date('Today, Thu 15 Oct'),M.foo(`Hi, I'm Trips. I'll look after your travel. I already see your Goa trip on Sat 12–Mon 14 Dec. Anything to sort for it?`,'8:11 PM')]}},
{c:`Vikas adds Money and Home the same way. foo's own chat notes each one.`,s:`Three helper rows. In foo's chat: "You made a new helper: Trips" (and Money, Home).`,f:`foo stays the main voice. Helpers only speak in their own chats.`,hl:'row-money',a:{sel:'foo',hdr:{status:'Awake on your PC'}},rowp:{money:R('money','Money','8:14 PM',`Hi, I'm Money. I'll look after bills and payments.`),home:R('home','Home','8:16 PM',`Hi, I'm Home. Gas, groceries, repairs.`)},order:['foo','trips','money','home','family'],add:[M.sys('You made a new helper: Trips'),M.sys('You made a new helper: Money'),M.sys('You made a new helper: Home')]},

start:{view:'desk',d:{app:false,time:'8:00 AM'},th:{foo:[M.date('Thu 15 Oct'),M.foo(`I'll send your first morning brief tomorrow, Fri 16 Oct, 8:00 AM.`,'7:50 PM')]},rowp:{foo:{time:'8:00 AM',prev:'Good morning, Vikas. 4 things today',badge:1,u:1}}},
steps:[
{c:`8:00 AM. The window is closed, so the brief arrives as one Windows notification.`,s:`A notification from foo: "Good morning. 4 things today." with one Open button.`,f:`Read your calendar, Gmail, WhatsApp mentions and open jobs at 7:45 AM, then kept the 4 that matter.`,hl:'toast-1',d:{toast:{title:'Good morning. 4 things today.',btns:['Open']}}},
{c:`You tap Open. One message, a few lines, and then it ends.`,s:`"☀ Good morning, Vikas": Mom's birthday · Airtel bill · Goa prices · weather. Each line has at most one button and 👍 👎. "That's all for today."`,f:`Every button is only a suggestion. Nothing starts until you tap it.`,hl:'brief',view:'app',d:{toast:null,app:true},add:[M.date('Today, Fri 16 Oct'),M.card('brief',BRIEF())],rowp:{foo:{badge:null,u:null}}},
{c:`You tap 👍 on the Goa line. That's all that happens.`,s:`The 👍 fills in. No reply, no new message.`,f:`Saves it to rank tomorrow's brief.`,hl:'th-goa',upd:{brief:M.card(0,BRIEF({up:['goa']}))}},
{c:`👎 on the weather, the second time this week. foo asks once, right under the brief.`,s:`"Stop showing weather in your brief?" Yes, stop · Keep it.`,f:`Asks only once. If you say no, it never asks again.`,hl:'stopw',upd:{brief:M.card(0,BRIEF({up:['goa'],dn:['weather'],q:`<div class="imp" style="display:flex;align-items:center;gap:8px">Stop showing weather in your brief? <span style="flex:1"></span>${B('Yes, stop','dark','stopw')}${B('Keep it')}</div>`}))}},
{c:`You type "more cricket, less weather". foo just reacts 👍. No "Noted!" message.`,s:`Your bubble with a small 👍 reaction.`,f:`Saves your words exactly. Tomorrow's brief follows them.`,hl:'mc',upd:{brief:M.card(0,BRIEF({up:['goa'],dn:['weather']}))},add:[M.me('more cricket, less weather','8:03 AM',{r:'👍',hl:'mc'})]},
{c:`On a light day there's just one line.`,s:`Sun 18 Oct: "☀ Good morning, Vikas. Nothing needs you today. Enjoy it." 👍 👎`,f:`Fewer than 2 things worth saying means no cards at all.`,hl:'light',add:[M.date('Sun 18 Oct'),M.foo(`☀ Good morning, Vikas. Nothing needs you today. Enjoy it. · 👍 👎`,'8:00 AM',{hl:'light'})]},
{c:`A brief you never opened fades at 8:00 PM, so old news never looks new.`,s:`The brief dimmed, labelled "Expired · open anyway".`,f:`Dims after 12 hours. Nothing is deleted.`,hl:'brief',th:{foo:[M.date('Today, Fri 16 Oct'),M.card('brief',BRIEF({dim:1}))]},d:{time:'8:00 PM'}},
{c:`If your PC was asleep at 8:00 AM, the brief comes soon after it wakes and says it's late.`,s:`"☀ Good morning, Vikas. A bit late today: your PC was asleep at 8:00 AM."`,f:`Never sends two briefs, and never a stale one.`,hl:'late',th:{foo:[M.date('Today, Fri 16 Oct'),M.foo('☀ Good morning, Vikas. A bit late today: your PC was asleep at 8:00 AM.','9:12 AM',{hl:'late'}),M.card('brief',BRIEF())]},d:{time:'9:12 AM'}}
]});

steps:[
{c:`Hold Ctrl+Space (or the mic button) and talk. Let go to send.`,s:`The message box turns into a recording bar: red dot, "0:07", "Release to send · Esc to cancel".`,f:`Records on your PC. Esc throws it away. Five minutes at most.`,hl:'mic',a:{comp:{m:'rec',text:'0:07'}}},
{c:`The very first time, foo fetches its voice pack once (about 150 MB).`,s:`Your voice bubble, and a line: "Getting voice ready (one time, about 150 MB)…"`,f:`Turns speech into text on your PC, so your voice doesn't go anywhere.`,hl:'vin',a:{comp:{m:'rest'}},add:[VB(1,'0:09','','8:31 AM',{hl:'vin',id:'vin'}),M.shim('Getting voice ready (one time, about 150 MB)…')]},

{c:`You spoke, so foo answers with a voice note plus the same text. It never plays by itself.`,s:`foo's voice bubble with ▶, speed 1×, and the text: "Done. I'll remind you Sat 17 Oct, 10:00 AM to call the plumber."`,f:`Default is "voice back when you send voice". Press ▶ to hear it.`,hl:'play',add:[VB(0,'0:05',`Done. I'll remind you Sat 17 Oct, 10:00 AM to call the plumber.`,'8:31 AM',{hlp:'play',id:'vout'})]},

steps:[

{c:`One missing piece, one question.`,s:`"How often should I check?" Every 30 min (Best fit) · Every hour · Once a day at 9:00 AM.`,f:`Every 30 minutes is the minimum that makes sense for prices.`,hl:'often0',add:[M.card('q',choice('How often should I check?',[['Every 30 min',1],['Every hour'],['Once a day at 9:00 AM']],{hlp:'often',other:false}))]},
{c:`foo runs it once right away, so you see what it will do.`,s:`"Right now BTC is ₹57,20,000 (57.2 lakh), above your line. Here's what the routine will do:"`,f:`A real first run, not a promise.`,hl:'now',upd:{q:M.card(0,ans('How often should I check?','Every 30 min')),ask:M.me('tell me when BTC drops below ₹55 lakh','10:14 AM',{b:'✅'})},add:[M.foo(`Right now BTC is ₹57,20,000 (57.2 lakh), above your line. Here's what the routine will do:`,'10:15 AM',{hl:'now'})]},
{c:`The Routine card: what, how often, when it tells you, where, cost and the next run.`,s:`Checks Bitcoin price in rupees · Every 30 min, 7:00 AM to 10:00 PM · only if below ₹55,00,000 (55 lakh) · Money chat + notification · about ₹30 of your AI a month · Next run Fri 16 Oct, 10:45 AM.`,f:`Routines never send, buy, book, post or delete. They end in a card.`,hl:'rcard',add:[M.card('r',RCARD())]},
{c:`When nothing is true, you hear nothing. Even after 50 runs.`,s:`Routines page (Ctrl+R): last runs "✓ 10:15 AM · nothing to tell", "✓ 9:45 AM · nothing to tell".`,f:`Logs every quiet run so you can check it's alive.`,hl:'rt-btc',a:{page:{k:'routines'}}},
{c:`At 2:45 PM the price dips. One message, with a reason underneath.`,s:`"BTC just dropped to ₹54,80,000 (54.8 lakh), below your ₹55,00,000 line. Checked 2:45 PM on CoinDCX." · "Why am I getting this? Your BTC routine."`,f:`Won't repeat the same alert until the price goes back above the line.`,hl:'whyl',a:{page:null},add:[M.foo('BTC just dropped to ₹54,80,000 (54.8 lakh), below your ₹55,00,000 line. Checked 2:45 PM on CoinDCX.','2:45 PM'),M.raw('<span class="under" data-hl="whyl">Why am I getting this? Your BTC routine.</span>','whyl',2)]},
{c:`Change it by just saying so. The changed line is highlighted.`,s:`"make the BTC check hourly" → the Routine card again with "How often: Every hour (was every 30 min)" and "Updated. Next run Fri 16 Oct, 4:00 PM."`,f:`Edits the routine; nothing else changes.`,hl:'rcard',add:[M.me('make the BTC check hourly','3:02 PM'),M.card('r2',RCARD({hd:'⏰ Routine updated',often:'<b style="background:var(--accent-soft);padding:0 4px;border-radius:4px">Every hour (was every 30 min)</b>',next:'Fri 16 Oct, 4:00 PM'})),M.foo('Updated. Next run Fri 16 Oct, 4:00 PM.','3:02 PM')]},
{c:`Pause it from the Routines page.`,s:`The switch turns off; the row says "Paused". In chat: "Paused. I won't check BTC until you turn it back on."`,f:`"Pause all" would pause every routine at once.`,hl:'rtoggle',a:{page:{k:'routines',on:false,often:'Every hour, 7:00 AM to 10:00 PM (your time, IST)',next:'—',over:{btc:'Paused'}}}},
{c:`Delete asks first, because history goes too.`,s:`"Delete the BTC routine? Its history goes too. This can't be undone." Delete routine · Keep routine.`,f:`Nothing else is touched.`,hl:'delr',a:{ov:{k:'dlg',title:'Delete the BTC routine?',body:`<p class="sub">Its history goes too. This can't be undone.</p>`,btns:B('Delete routine','bad','delr')+B('Keep routine')}}},
{c:`"foo suggests" shows up to 3 ideas from your habits. Dismissed ones never come back.`,s:`Under the list: "Every Friday, list bills due next week" · Add · Not now.`,f:`Never adds a routine without your tap.`,hl:'suggest',a:{ov:null}}
]});

CH.push({id:'memory',part:P2,t:'Memory you can see and forget',j:'J17',r:'R13',
start:{th:{foo:[M.date('Today, Fri 16 Oct')]},d:{time:'12:00 PM'}},
steps:[
{c:`"remember I'm allergic to peanuts." foo reacts 👍 and shows exactly what it saved.`,s:`A 👍 on your bubble and a chip: "🧠 I'll remember: Allergic to peanuts · Undo".`,f:`Saves it as "You said", dated today.`,hl:'memchip',add:[M.me(`remember I'm allergic to peanuts`,'12:00 PM',{r:'👍'}),memchip(`I'll remember: Allergic to peanuts · <u>Undo</u>`)],a:{det:{mem:[['Allergic to peanuts','You said · Fri 16 Oct · Edit'],['Likes beach stays, hates early flights','You said · Sat 3 Oct · Edit'],['Budget trips under ₹40,000','I guessed · from 2 trips · Edit']],memn:25}}},
{c:`When foo notices something, it says it's a guess and why.`,s:`In Trips: "🧠 I noticed you pick window seats. Saved · Undo".`,f:`Health, money, religion, politics or other people's numbers are never guessed, only saved if you say them.`,hl:'memchip',a:{sel:'trips',hdr:{status:'Awake on your PC'}},th:{trips:[M.date('Today, Fri 16 Oct'),M.foo('Booked 2 window seats on the Deccan Queen, Sat 24 Oct.','10:20 AM'),memchip('I noticed you pick window seats. Saved · <u>Undo</u>')]}},
{c:`The Details panel always shows the top things foo knows about you.`,s:`"What I know about you": Allergic to peanuts · Likes beach stays · Budget trips under ₹40,000 · See all (25).`,f:`Each line says "You said" or "I guessed".`,hl:'memsec',a:{sel:'foo'}},
{c:`The full page (Ctrl+M): every fact, where it came from, and when.`,s:`Filters All · You said · I guessed · People · From Gmail · From WhatsApp. Rows with Edit · Forget · Mark private.`,f:`Memory is plain files on your PC. Nothing is hidden.`,hl:'mf-All',a:{page:{k:'memory'}}},
{c:`Filter to "I guessed" to check foo's guesses.`,s:`Only "Prefers window seats · from 4 bookings" and "Mom's birthday · From Gmail".`,f:`Shows the reason for every guess.`,hl:'mf-I guessed',a:{page:{k:'memory',filter:'I guessed'}}},
{c:`Correct things by just saying them. Old facts are replaced, not piled up.`,s:`"actually I moved to Pune" → "Updated: you live in Pune (was Mumbai)." with Undo.`,f:`Updates the fact and its date.`,hl:'upd',a:{page:null},add:[M.me('actually I moved to Pune','12:05 PM',{r:'👍'}),M.chip('🧠 Updated: you live in Pune (was Mumbai) · <u>Undo</u>','mem','upd')]},
{c:`Forget one thing. It disappears with a 5-second Undo.`,s:`The window-seats row is gone. A bar: "Forgot 'Prefers window seats' · Undo".`,f:`Won't use it again, or re-learn it from the same bookings, for 90 days.`,hl:'undo',a:{page:{k:'memory',gone:['Prefers window seats'],edit:['Lives in Mumbai','Lives in Pune'],undo:`Forgot "Prefers window seats" · <span class="ub">Undo</span>`}}},
{c:`Forget everything from one source, with a count.`,s:`"Forget 23 things I learned from your Gmail? Gmail stays connected; I just forget what I learned." Forget 23 things · Keep them.`,f:`Leaves the Gmail connection alone.`,hl:'f23',a:{page:{k:'memory',gone:['Prefers window seats'],edit:['Lives in Mumbai','Lives in Pune']},ov:{k:'dlg',title:'Forget 23 things I learned from your Gmail?',body:`<p class="sub">Gmail stays connected; I just forget what I learned.</p>`,btns:B('Forget 23 things','bad','f23')+B('Keep them')}}},
{c:`Forget everything needs you to type FORGET.`,s:`"This deletes everything I know about you, including helpers' notes. Your chats stay. Type FORGET to confirm."`,f:`The button only works once the word matches.`,hl:'fall',a:{ov:{k:'dlg',w:440,title:'Forget everything?',body:`<p class="sub">This deletes everything I know about you, including helpers' notes. Your chats stay. Type FORGET to confirm.</p><div class="fld on" style="font-family:var(--mono)">FORGET</div>`,btns:B('Forget everything','bad','fall')+B('Keep it all')}}},
{c:`"Open the memory folder" shows the plain files. Edit one in Notepad and foo uses it next reply.`,s:`about-you.md in Notepad: simple lines like "- Allergic to peanuts (you said, Fri 16 Oct)".`,f:`No hidden database: your memory is yours to read.`,hl:'notepad',view:'desk',a:{ov:null},d:{app:{x:20,y:20,sc:.62},wins:[{k:'notepad',x:520,y:90,w:620,h:420,text:`# About Vikas\n\n- Allergic to peanuts (you said, Fri 16 Oct)\n- Lives in Pune (you said, Fri 16 Oct)\n- Vegetarian on Tuesdays (you said, Fri 2 Oct)\n- Hates early flights (you said, Sat 3 Oct)\n- Likes beach stays (you said, Sat 3 Oct)\n\n## People\n- Brother Rohit lives in Pune (you said)\n- Mom's birthday: Sun 18 Oct (from Gmail)`}]}}
]});
