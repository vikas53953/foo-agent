CH.push({id:'groups',part:P2,t:'Groups, and what stays private',j:'J16',r:'R2 · R18',
start:{d:{time:'12:30 PM'}},
steps:[
{c:`Start a group from the ⋯ next to "+ New helper" → New group.`,s:`"New group": Name "Goa trip" · Members: Trips ✓ Money ✓ Home · foo · Create group · Not now.`,f:`A group is you plus 2–6 helpers. foo can join too.`,hl:'mkgrp',a:{ov:{k:'dlg',w:520,title:'New group',body:`<div class="frow"><span>Name</span><div class="fld on">Goa trip</div></div><div class="frow"><span>Members</span><div class="row2"><span class="chk on">Trips</span><span class="chk on">Money</span><span class="chk">Home</span><span class="chk">foo</span></div></div><p class="sub">Approvals, payments and personal details always move to a private chat.</p>`,btns:B('Create group','acc','mkgrp')+B('Not now')}}},
{c:`The group appears with stacked faces. The first helper you ticked opens it.`,s:`"Goa trip" row. "Trips here with Money. Tell us what you need for Goa."`,f:`Trips owns jobs here unless you @mention someone else.`,hl:'row-goa',a:{ov:null,sel:'goa',hdr:{status:'You, Trips and Money'}},rowp:{goa:R('goa','Goa trip','12:31 PM','Trips: Tell us what you need for Goa.',{grp:['trips','money']})},th:{goa:[M.date('Today, Fri 16 Oct'),GM('trips','Trips','Trips here with Money. Tell us what you need for Goa.','12:31 PM')]}},
{c:`You ask for something that needs two helpers.`,s:`"plan dinner Saturday for the 6 of us and split the cost".`,f:`Picks one owner for the job and hands the money part to Money.`,hl:'ask',add:[M.me('plan dinner on Sat 12 Dec for the 6 of us and split the cost','12:32 PM',{b:'🛠',hl:'ask'})]},
{c:`One owner speaks, and the handoff is visible.`,s:`"Trips: I'll find the place. Money will work out the split." · "Trips asked Money to work out the split".`,f:`Only one helper owns each job.`,hl:'hand',add:[GM('trips','Trips',`I'll find the place. Money will work out the split.`,'12:32 PM'),M.sys('Trips asked Money to work out the split','hand')]},
{c:`Choices can be answered in the group.`,s:`"Dinner on Sat 12 Dec: Fisherman's Wharf at 8:00 PM, table for 6?" Book it (Best fit) · Another place.`,f:`Shows only plain text, choices and files in groups.`,hl:'bookit0',add:[M.card('q',choice(`Dinner on Sat 12 Dec: Fisherman's Wharf at 8:00 PM, table for 6?`,[['Book it',1],['Another place']],{hlp:'bookit',other:false}))]},
{c:`You tap Book it. The approval moves to your private chat with Trips.`,s:`Amber line: "Trips: The booking and your phone number stay private. I've asked Vikas in his own chat." · Open Trips.`,f:`Approvals, payments, drafts, sign-ins and personal details never appear in a group.`,hl:'opent',upd:{q:M.card(0,ans(`Dinner on Sat 12 Dec?`,'Book it'))},add:[GM('trips','Trips',`The booking and your phone number stay private. I've asked Vikas in his own chat.`,'12:34 PM',{st:'background:var(--warn-soft)'}),M.card('o',card({body:'',btns:B('Open Trips','','opent')}),4)]},
{c:`In Trips' own chat: the real Approval card.`,s:`"Book this table?" Fisherman's Wharf, Sat 12 Dec, 8:00 PM · 6 people · Booked under Vikas Sharma · +91 98••• ••210 · Book table · Not now.`,f:`Same rules as any booking: a tap, then a second look.`,hl:'booktable',a:{sel:'trips',hdr:{status:'Needs you: Book table',tone:'warn'}},th:{trips:[M.date('Today, Fri 16 Oct'),M.raw(`<div class="b foo" style="max-width:560px"><span class="quote">From Goa trip: plan dinner on Sat 12 Dec for the 6 of us</span>Here's the booking to approve.<span class="meta">12:34 PM</span></div>`),M.card('ap',card({pend:1,hd:'📅 Book this table?',lbl:'Expires 12:49 PM',body:`<div>Fisherman's Wharf, Goa · Sat 12 Dec, 8:00 PM · 6 people</div><div class="sm">Booked under: Vikas Sharma · +91 98••• ••210</div>`+rc([['Charged now','₹0'],['Free to cancel until','Fri 11 Dec, 8:00 PM']]),btns:B('Book table','acc','booktable')+B('Not now')}))]}},
{c:`The group gets only the shareable result.`,s:`"Trips: Booked. Fisherman's Wharf, Sat 12 Dec, 8:00 PM, table for 6. ✓ #FW-2201" · "Money: ₹1,450 each for 6 people (estimate)."`,f:`Keeps your phone number and payment details out of the group.`,hl:'split',a:{sel:'goa',hdr:{status:'You, Trips and Money',tone:null}},add:[GM('trips','Trips',`Booked. Fisherman's Wharf, Sat 12 Dec, 8:00 PM, table for 6. ✓ #FW-2201`,'12:36 PM'),GM('money','Money','₹1,450 each for 6 people (estimate).','12:36 PM',{hl:'split'})],to:'goa'},
{c:`Your WhatsApp Family group shows read-only. foo can draft into it; you send.`,s:`Family group with a WhatsApp mark. A Draft: "Will send to Family group (8 people) from your WhatsApp. Can't be unsent." Send message.`,f:`Helpers never post in WhatsApp groups by themselves.`,hl:'sendmsg',a:{sel:'family',hdr:{status:'WhatsApp group · 8 people · read-only here'},comp:{m:'rest',ph:'Ask foo to draft a message for this group'}},add:[M.me('tell the family group we booked dinner in Goa','12:40 PM',{b:'⏳'}),M.card('d',DRAFT({lbl:'WhatsApp',to:'Family group (WhatsApp)',text:`Dinner in Goa on Sat 12 Dec, 8 PM at Fisherman's Wharf, table for 6 🍽`,imp:'Will send to Family group (8 people) from your WhatsApp. Can’t be unsent.',btns:B('Send message','acc','sendmsg')+B('Change')+B('Not now')}))],to:'family'},
{c:`If helpers go back and forth 6 times without you, the group pauses.`,s:`"We're going in circles. Pausing until you reply."`,f:`Stops runaway chatter and AI cost.`,hl:'circ',a:{sel:'goa',hdr:{status:'Paused until you reply',tone:'warn'},comp:{m:'rest'}},add:[GM('money','Money','Should the split include the cab?','1:10 PM'),GM('trips','Trips','The cab is a separate booking.','1:10 PM'),M.foo(`We're going in circles. Pausing until you reply.`,'1:11 PM',{hl:'circ'})],to:'goa'}
]});

CH.push({id:'search',part:P2,t:'Search everything (Ctrl+K)',j:'J22',r:'R22',
start:{rowp:{trips:{time:'9:45 AM',prev:'Booked. Taj Holiday Village…'}},th:{trips:[M.date('Today, Fri 16 Oct'),M.raw(`<div class="b foo" style="max-width:600px"><span class="quote">From foo: ok book the Goa hotel then… (Vikas, 9:36 AM)</span>Here's my plan.<span class="meta">9:36 AM</span></div>`),M.foo('Booked. <b>Taj</b> Holiday Village, Sat 12 – Mon 14 Dec, 2 nights, ₹14,600 paid. Added to your calendar.','9:45 AM',{id:'tajmsg'}),proof('Proof: booking #TJ88213 · email from MakeMyTrip')]},d:{time:'1:00 PM'}},
steps:[
{c:`Ctrl+K opens one search box over everything.`,s:`"Search chats, messages, files, routines, memory, settings" with filter chips.`,f:`Searches on your PC only. Nothing goes to your AI.`,hl:'palette',a:{ov:{k:'pal',groups:[['Recent',[{t:'airtel'},{t:'pizza by the bay'}]]]}}},
{c:`Type "taj". Results appear grouped, in a blink.`,s:`Messages: foo · "…book the Taj for Sat 12–Mon 14 Dec…" · Jobs: Goa stay · Done · Files: Taj-booking.pdf · What I know: Likes beach stays.`,f:`Shows results after 2 letters, under a third of a second.`,hl:'r1',a:{ov:{k:'pal',q:'taj',groups:[['Chats & helpers',[{i:av('trips','s'),t:'Trips',r:'Helper'}]],['Messages',[{i:av('trips','s'),t:'Trips · Fri 16 Oct',s:'Booked. <b>Taj</b> Holiday Village, Sat 12 – Mon 14 Dec…',on:1,h:'r1'},{i:av('foo','s'),t:'foo · Fri 16 Oct',s:'…book the <b>Taj</b> for Sat 12–Mon 14 Dec…'}]],['Jobs',[{t:'Goa stay · Done · Fri 16 Oct'}]],['Files',[{t:'📄 Taj-booking.pdf',r:'Open · Show in folder'}]]]}}},
{c:`Enter opens the chat at that exact message, highlighted for 2 seconds.`,s:`Trips' chat, the "Booked. Taj Holiday Village…" bubble glowing.`,f:`Jumps without loading anything new.`,hl:'tajmsg',a:{ov:null,sel:'trips',hdr:{status:'Awake on your PC'}},upd:{tajmsg:M.foo('Booked. <b>Taj</b> Holiday Village, Sat 12 – Mon 14 Dec, 2 nights, ₹14,600 paid. Added to your calendar.','9:45 AM',{hl:'tajmsg',st:'box-shadow:0 0 0 4px var(--accent-soft)'})}},
{c:`Ctrl+Enter asks foo instead. Only then do your words go to your AI.`,s:`"What did I book in Goa?" answered in foo's chat, with source pills you can click.`,f:`Answers from your own chats and files, and shows where each fact came from.`,hl:'cite',a:{sel:'foo'},th:{foo:[M.date('Today, Fri 16 Oct'),M.me('What did I book in Goa?','1:02 PM',{b:'✅'}),M.raw(`<div class="b foo">Taj Holiday Village, Sat 12 – Mon 14 Dec, ₹14,600 <span class="cite"${hl('cite')}>Trips · Fri 16 Oct</span>, and dinner at Fisherman's Wharf on Sat 12 Dec, 8:00 PM <span class="cite">Goa trip · Fri 16 Oct</span>.<span class="meta">1:02 PM</span></div>`)]}},
{c:`The chips above the chat list filter it. "Needs you" shows only what's waiting on you.`,s:`Only the Money row, with its amber "Needs you".`,f:`Counts come from the real jobs.`,hl:'chip-Needs you',a:{filter:'Needs you'},rowp:{money:{st:'need',prev:'Needs your OK: Pay Tata Power ₹2,340'}}},
{c:`Ctrl+F finds words inside the open chat.`,s:`A "Find in this chat" bar: "rent", 1 of 3, ↑ ↓.`,f:`Highlights each match in turn.`,hl:'rentm',a:{filter:'All',find:'rent'},th:{foo:[M.date('Today, Fri 16 Oct'),M.me(`reply to my landlord saying I'll pay <span class="mark"${hl('rentm')}>rent</span> on Monday`,'11:00 AM',{b:'✅'}),M.card('dr',DRAFT({pend:false,hd:'✓ Sent · Fri 16 Oct, 11:06 AM',to:'Rakesh Sharma',text:`Dear Rakesh, I will pay October's <span class="mark">rent</span> on Monday, 19 October…`}))]}}
]});

CH.push({id:'notify',part:P3,t:'Notifications, taskbar and tray',j:'J20',r:'R15 · R23',
start:{a:{det:{buy:1179,doing:[{k:'w',t:'Trips · Goa stay',s:'Step 3 of 4 · Filling guest details',eye:1},{k:'w',t:'Trips · Delhi flights',s:'Step 2 of 4 · Comparing fares'}]}},rowp:{trips:{time:'9:38 AM',st:'work',prev:'Filling guest details'}},d:{time:'9:39 AM'}},
steps:[
{c:`The first time you close the window, foo explains it keeps working.`,s:`"foo keeps working in the background. So it can do your jobs, routines and morning brief. You'll find foo in the tray, next to the clock." Got it · Quit foo instead · "Don't show again" ticked.`,f:`Closing never quits foo unless you choose to.`,hl:'gotit',a:{ov:{k:'dlg',w:440,title:'foo keeps working in the background',body:`<p class="sub">So it can do your jobs, routines and morning brief. You'll find foo in the tray, next to the clock.</p><label style="display:flex;gap:8px;align-items:center;font-size:13px"><span class="tog" style="width:18px;height:18px;border-radius:4px"></span>Don't show again</label>`,btns:B('Got it','acc','gotit')+B('Quit foo instead')}}},
{c:`foo lives in the tray. Hover it to see what it's doing.`,s:`Tooltip "foo · 2 jobs running". The taskbar button shows a thin green progress line.`,f:`Keeps your PC from sleeping only while a job is working.`,hl:'tray-foo',view:'desk',a:{ov:null},d:{app:false,tip:'foo · 2 jobs running',tb:{prog:1}}},
{c:`A payment needs you. The notification can only open the card, never pay.`,s:`"foo · Trips · Pay Taj Holiday Village ₹14,600?" Review · Not now. The taskbar "f" gets an amber "!".`,f:`No secrets, card numbers or codes in notifications. At most one per chat every 2 minutes.`,hl:'toast-1',d:{tip:null,time:'9:41 AM',tb:{badge:'need',prog:1},toast:{av:'trips',from:'Trips',title:'Pay Taj Holiday Village ₹14,600?',btns:['Review','Not now']}}},
{c:`Review opens foo right at the card, ready for your tap.`,s:`Trips' chat with the Payment card focused.`,f:`The approval itself only ever happens inside foo's window.`,hl:'approve',view:'app',d:{toast:null,tb:{badge:'need'}},a:{sel:'trips',hdr:{status:'Needs you: Pay Taj Holiday Village',tone:'warn'}},rowp:{trips:{st:'need',prev:'Needs your OK: Pay Taj Holiday Village'}},th:{trips:[M.date('Today, Fri 16 Oct'),M.card('pay',TAJ({cls:'flash'}))]}},
{c:`A normal reply can be answered right from the notification.`,s:`"foo · Trips · Want me to add the return flight too?" with a small reply box: "yes, Mon 14 Dec evening".`,f:`Quick replies are just messages, so they're allowed.`,hl:'toastreply',view:'desk',d:{app:false,tb:null,toast:{av:'trips',from:'Trips',title:'Want me to add the return flight too?',reply:'yes, Mon 14 Dec evening',btns:['Reply']}}},
{c:`Right-click the tray icon for the essentials.`,s:`Open foo · Needs you (1) · Doing now: Goa stay · step 3 of 4 · Pause routines until 10:00 AM, Fri 16 Oct · Quiet until… · Stop everything… · Settings · Quit foo.`,f:`Every time in the menu is a real date and time.`,hl:'traymenu',d:{toast:null,menu:TRAYMENU}},
{c:`Quiet hours start at 10:00 PM. foo and its helpers close their eyes, and nothing pops up.`,s:`11:30 PM. Closed eyes and a small "z" on foo, Trips, Money and Home, in the chat list and the header. The tray face has its eyes closed too: "foo · quiet until 7:00 AM".`,f:`Holds notifications until 7:00 AM. A job that is still running keeps its face awake, with the turning blue ring.`,hl:'tray-foo',view:'desk',d:{menu:null,toast:null,app:{x:40,y:16,sc:.78},time:'11:30 PM',date:'16-10-2026',tip:'foo · quiet until 7:00 AM'},a:{sel:'foo',hdr:{status:'Quiet until 7:00 AM',tone:null},det:{doing:[]}},rowp:{trips:{st:null,time:'9:45 PM',prev:'Want me to add the return flight too?'}}},
{c:`During quiet hours (10:00 PM–7:00 AM) notifications wait, then come as one summary.`,s:`Sat 17 Oct, 7:00 AM: "While you were away: 1 thing needs you, 2 jobs done."`,f:`Respects Windows Focus too, and adds nothing on top. At 7:00 AM the faces open their eyes again.`,hl:'toast-1',rowp:{trips:{st:'need',prev:'Needs your OK: Pay Taj Holiday Village'}},d:{menu:null,tip:null,app:false,time:'7:00 AM',date:'17-10-2026',toast:{title:'While you were away: 1 thing needs you, 2 jobs done.',btns:['Open']}}},
{c:`When a job finishes, the taskbar shows a green tick for 30 minutes.`,s:`"Booked: Taj Holiday Village, Sat 12–Mon 14 Dec. ₹14,600 paid." and a green ✓ on foo's taskbar button.`,f:`Plain unread messages never badge the taskbar.`,hl:'tb-foo',rowp:{trips:{st:'done',prev:'Booked: Taj Holiday Village'}},d:{time:'9:45 AM',date:'16-10-2026',tb:{badge:'done'},toast:{av:'trips',from:'Trips',title:'Booked: Taj Holiday Village, Sat 12–Mon 14 Dec. ₹14,600 paid.',btns:['Open']}}},
{c:`Right-click foo in the taskbar for quick tasks. No counts there, ever.`,s:`New message to foo · Search · Stop everything · Settings.`,f:`Same four tasks every time.`,hl:'jump',d:{toast:null,tb:null,wins:[{k:'jump',x:520,y:420}]}},
{c:`Quitting with jobs running asks first, and nothing is paid while foo is closed.`,s:`"Quit foo? 2 jobs are running. They'll pause and pick up when you open foo again. Nothing will be paid while foo is closed." Quit · Keep running.`,f:`Saves every job. It never blocks Windows from shutting down.`,hl:'nd-1',d:{wins:[{k:'ndlg',x:390,y:220,w:500,h:250,title:'Quit foo?',body:`2 jobs are running. They'll pause and pick up when you open foo again. Nothing will be paid while foo is closed.`,btns:['Quit','Keep running']}]}}
]});

CH.push({id:'spend',part:P3,t:'Spend caps you can always see',j:'J19',r:'R19',

/* ================= walkthrough UI ================= */
(function(){
  const STEPS=[];window.__missHl=[];
  CH.forEach((ch,ci)=>{
    const s=ch.base?ch.base():world();
    if(ch.start)apply(s,ch.start,ch.id+':start');
    ch.first=STEPS.length;
    let prevMo=null;
    ch.steps.forEach((st,si)=>{apply(s,st,ch.id+':'+(si+1));
      const fo=(typeof FACE_OV!=='undefined'&&FACE_OV[ch.id+'-'+(si+1)])||{};
      const mo=moodsOf(s,Object.assign({},st,{fm:Object.assign({},fo.fm||{},st.fm||{}),toastMood:fo.toast||st.toastMood}),prevMo);
      s.mo=mo;prevMo=mo;
      STEPS.push({ci,si,st,state:clone(s)})});
  });
  window.__STEPS=STEPS;window.__CH=CH;
  const $=id=>document.getElementById(id);
  const frame=$('frame'),stage=$('stage'),nav=$('chapters'),film=$('film'),filmGrid=$('filmGrid');
  let cur=0,timer=null,filmOn=false;

  // chapter list
  let lastPart='';
  nav.innerHTML=CH.map((ch,ci)=>{const p=ch.part!==lastPart?`<div class="pt">${ch.part}</div>`:'';lastPart=ch.part;
    return p+`<button class="ch" type="button" data-ci="${ci}"><span class="n">${String(ci+1).padStart(2,'0')}</span><span>${ch.t}</span><span class="c">${ch.steps.length}</span><small>${ch.j} · ${ch.r}</small></button>`}).join('');
  nav.addEventListener('click',e=>{const b=e.target.closest('button.ch');if(!b)return;go(CH[+b.dataset.ci].first);$('aside').classList.remove('open');if(filmOn)renderFilm()});
  $('total').textContent=STEPS.length+' steps · '+CH.length+' chapters';

  function mark(root,id){
    if(!id)return;
    const els=root.querySelectorAll(`[data-hl="${CSS.escape(id)}"]`);
    if(!els.length){return false}
    els[els.length-1].classList.add('hl');return true;
  }
  function fit(){
    const wrap=$('stagewrap');const mw=wrap.clientWidth;let w=mw;
    if(window.innerWidth>980){const maxH=Math.max(260,window.innerHeight-52-3-28-250);w=Math.min(mw,maxH*1.6)}
    const sc=w/1280;stage.style.width=Math.floor(w)+'px';stage.style.height=Math.floor(800*sc)+'px';frame.style.transform=`scale(${sc})`;
  }
  function go(i){
    cur=Math.max(0,Math.min(STEPS.length-1,i));
    const S=STEPS[cur],ch=CH[S.ci];
    frame.innerHTML=renderFrame(S.state);
    if(S.st.hl&&!mark(frame,S.st.hl))window.__missHl.push(ch.id+':'+(S.si+1)+' '+S.st.hl);
    $('meta').innerHTML=`<b>${String(S.ci+1).padStart(2,'0')}</b><span>${ch.t}</span><span>·</span><span>Step ${S.si+1} of ${ch.steps.length}</span><span class="tag">${ch.j}</span><span class="tag">${ch.r}</span><span style="margin-left:auto">${cur+1} / ${STEPS.length}</span>`;
    $('capt').textContent=S.st.c;$('see').textContent=S.st.s;$('does').textContent=S.st.f;
    $('dots').innerHTML=ch.steps.map((_,k)=>`<button type="button" aria-label="Step ${k+1}" data-k="${k}"${k===S.si?' aria-current="true"':''}></button>`).join('');
    $('back').disabled=cur===0;$('next').disabled=cur===STEPS.length-1;
    $('next').textContent=S.si===ch.steps.length-1&&cur<STEPS.length-1?'Next chapter →':'Next →';
    document.querySelectorAll('aside button.ch').forEach(b=>b.setAttribute('aria-current',+b.dataset.ci===S.ci?'true':'false'));
    const cb=document.querySelector(`aside button.ch[data-ci="${S.ci}"]`);if(cb&&cb.scrollIntoView&&!filmOn){const r=cb.getBoundingClientRect(),ar=$('aside').getBoundingClientRect();if(r.top<ar.top||r.bottom>ar.bottom)cb.scrollIntoView({block:'nearest'})}
    $('bar').style.width=((cur+1)/STEPS.length*100)+'%';
    try{history.replaceState(null,'',`#${ch.id}-${S.si+1}`)}catch(e){}
    fit();
  }
  $('dots').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(CH[STEPS[cur].ci].first+ +b.dataset.k)});
  $('back').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
  document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}else if(e.key==='Escape'){if(filmOn)toggleFilm(false);$('aside').classList.remove('open')}});
  // autoplay
  const ap=$('auto');
  function setAuto(on){if(timer){clearInterval(timer);timer=null}ap.setAttribute('aria-pressed',on);ap.innerHTML=(on?'❚❚':'▶')+'<span class="lb"> Autoplay</span>';if(on){if(filmOn)toggleFilm(false);timer=setInterval(()=>{if(cur>=STEPS.length-1)setAuto(false);else go(cur+1)},4200)}}
  ap.onclick=()=>setAuto(!timer);
  // theme
  $('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('fooux-theme',r.dataset.theme)}catch(e){}};
  try{const t=localStorage.getItem('fooux-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  $('menu').onclick=()=>$('aside').classList.toggle('open');
  // filmstrip
  function renderFilm(){
    const ci=STEPS[cur].ci,ch=CH[ci];
    $('filmTitle').textContent=`${String(ci+1).padStart(2,'0')} · ${ch.t} — all ${ch.steps.length} steps`;
    filmGrid.innerHTML=ch.steps.map((st,k)=>{const S=STEPS[ch.first+k];return `<button class="fs" type="button" data-i="${ch.first+k}"${ch.first+k===cur?' aria-current="true"':''}><div class="fsw"><div class="frame">${renderFrame(S.state)}</div></div><p><b>${k+1}</b>${st.c}</p></button>`}).join('');
    filmGrid.querySelectorAll('.fs').forEach((b,k)=>mark(b,ch.steps[k].hl));
    fitFilm();
  }
  function fitFilm(){filmGrid.querySelectorAll('.fsw').forEach(w=>{const sc=w.clientWidth/1280;w.firstElementChild.style.transform=`scale(${sc})`})}
  function toggleFilm(on){filmOn=on;$('filmBtn').setAttribute('aria-pressed',on);$('player').hidden=on;film.hidden=!on;if(on){setAuto(false);renderFilm();window.scrollTo(0,0)}else go(cur)}
  $('filmBtn').onclick=()=>toggleFilm(!filmOn);$('filmBack').onclick=()=>toggleFilm(false);
  filmGrid.addEventListener('click',e=>{const b=e.target.closest('.fs');if(!b)return;cur=+b.dataset.i;toggleFilm(false)});
  window.addEventListener('resize',()=>{fit();if(filmOn)fitFilm()});
  // start
  let start=0;const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^([a-z]+)-(\d+)$/);
  if(m){const ch=CH.find(c=>c.id===m[1]);if(ch)start=ch.first+Math.min(ch.steps.length,+m[2])-1}
  go(start);
  window.__go=go;window.__film=toggleFilm;
})();

</script>
