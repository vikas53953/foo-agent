# Spec: 09-windows §9.2 (identity), §9.3 (NSIS per-user assisted, no admin). Installer screens and signing arrive in M14.
appId: com.foo.desktop
productName: foo
executableName: foo
directories:
  output: dist
files:
  - out/**
  # 08-3 §22.1: test hooks never ship (CI greps app.asar for them).
  - '!out/main/main/test/**'
  - '!out/main/preload/preloadTest.js'
  - resources/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  # 09 §9.19.2: the foo-native addon (a .node cannot load from inside app.asar).
  - node_modules/foo-native/build/Release/*.node
win:
  target: nsis
  icon: resources/icons/foo.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
protocols:
  - name: foo
    schemes:
      - foo
